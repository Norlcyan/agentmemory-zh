    var wsReconnectTimer = null;
    var wsRetries = 0;
    var directFailed = true;
    var directFailures = 0;
    var wsHasConnected = false;
    var wsOpenedAt = null;
    var DIRECT_FAILURE_THRESHOLD = 2;
    var OFFLINE_AFTER_RETRIES = 3;
    var HEALTH_STALE_MS = 90000;
    var conn = { state: 'connecting', nextRetryAt: 0, lostAt: 0 };

    function reconnectDelay(attempt) {
      var n = Math.max(1, attempt || 1);
      return Math.min(30000, 1000 * Math.pow(2, n - 1));
    }

    function setWsStatus(text, cls) {
      var el = document.getElementById('ws-status');
      if (!el) return;
      el.textContent = text;
      el.className = 'ws-status ' + cls;
    }

    function setConnection(next) {
      conn.state = next;
      if (next === 'live') conn.lostAt = 0;
      else if (!conn.lostAt && wsHasConnected) conn.lostAt = Date.now();
      document.body.classList.toggle('is-stale', next !== 'live' && next !== 'connecting');
      renderConnection();
      if (store.snapshot) {
        markDirty(['health']);
        if (state.activeTab === 'health') renderTab('health');
      }
    }

    function renderConnection() {
      var secs = conn.nextRetryAt ? Math.max(0, Math.ceil((conn.nextRetryAt - Date.now()) / 1000)) : 0;
      var healthStale = conn.state === 'live' && store.lastHealthAt && Date.now() - store.lastHealthAt > HEALTH_STALE_MS;
      if (conn.state === 'live') setWsStatus(healthStale ? '实时 · 健康更新静默' : '实时', healthStale ? 'stale-health' : 'connected');
      else if (conn.state === 'connecting') setWsStatus('连接中', 'connecting');
      else if (conn.state === 'reconnecting') setWsStatus('重新连接中' + (secs ? ' · ' + secs + '秒' : ''), 'reconnecting');
      else setWsStatus('离线' + (secs ? ' · ' + secs + '秒后重试' : ''), 'offline');
      var chip = document.getElementById('ws-status');
      if (chip) chip.title = healthStale
        ? '已连接，但 ' + Math.round((Date.now() - store.lastHealthAt) / 1000) + ' 秒内没有收到健康更新。工作进程可能正忙。'
        : GLOSSARY.live.text;
      var banner = document.getElementById('offline-banner');
      if (!banner) return;
      var showBanner = conn.state === 'reconnecting' || conn.state === 'offline';
      if (!showBanner) { banner.hidden = true; banner.innerHTML = ''; return; }
      var asOf = store.snapshotAt ? new Date(conn.lostAt || store.snapshotAt).toLocaleTimeString() : '';
      banner.hidden = false;
      banner.className = 'offline-banner' + (conn.state === 'offline' ? ' offline' : '');
      banner.innerHTML = '<strong>' + (conn.state === 'offline' ? 'agentmemory 无法访问。' : '实时更新已暂停。') + '</strong>' +
        '<span>' + (asOf ? '显示数据截至 ' + esc(asOf) + '.' : '尚未加载任何数据。') + ' ' + (secs ? '下次重连尝试在 ' + secs + 's.' : '正在重连。') + '</span>' +
        (conn.state === 'offline' ? '<span style="color:var(--ink-muted);">请确认服务器正在运行：</span>' + cmdBlock('npx @agentmemory/agentmemory status') : '') +
        '<button class="btn" data-action="reconnect-now">立即重连</button>';
    }

    var healthStaleTimer = null;
    function scheduleHealthStaleCheck() {
      if (healthStaleTimer) clearTimeout(healthStaleTimer);
      healthStaleTimer = setTimeout(function() {
        healthStaleTimer = null;
        renderConnection();
        markDirty(['health', 'dashboard']);
        if (state.activeTab === 'health' || state.activeTab === 'dashboard') renderTab(state.activeTab);
      }, HEALTH_STALE_MS + 1000);
    }

    var countdownTimer = null;
    function scheduleCountdown() {
      if (countdownTimer) return;
      countdownTimer = setTimeout(function() {
        countdownTimer = null;
        if (conn.state === 'reconnecting' || conn.state === 'offline') {
          renderConnection();
          scheduleCountdown();
        }
      }, 1000);
    }

    function scheduleReconnect() {
      wsRetries++;
      var delay = reconnectDelay(wsRetries);
      conn.nextRetryAt = Date.now() + delay;
      setConnection(wsRetries >= OFFLINE_AFTER_RETRIES ? 'offline' : 'reconnecting');
      scheduleCountdown();
      if (wsReconnectTimer) clearTimeout(wsReconnectTimer);
      wsReconnectTimer = setTimeout(connectWs, delay);
    }

    function reconnectNow() {
      if (wsReconnectTimer) clearTimeout(wsReconnectTimer);
      wsReconnectTimer = null;
      directFailures = 0;
      directFailed = true;
      conn.nextRetryAt = 0;
      var ws = state.ws;
      if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;
      connectWs();
    }

    var WS_CONNECT_TIMEOUT_MS = 5000;

    function connectWs() {
      wsReconnectTimer = null;
      conn.nextRetryAt = 0;
      var useDirect = !directFailed;
      var ws;
      try {
        ws = new WebSocket(useDirect ? WS_DIRECT_URL : WS_URL);
        ws.__direct = useDirect;
      } catch (_) {
        scheduleReconnect();
        return;
      }
      var connectTimer = setTimeout(function() {
        if (ws.readyState === WebSocket.CONNECTING) {
          try { ws.close(); } catch {}
        }
      }, WS_CONNECT_TIMEOUT_MS);
      ws.onopen = function() {
        clearTimeout(connectTimer);
        if (state.ws !== ws) return;
        wsRetries = 0;
        if (!ws.__direct) {
          ws.send(JSON.stringify({
            type: 'join',
            data: {
              subscriptionId: 'viewer-' + Date.now(),
              streamName: 'mem-live',
              groupId: 'viewer'
            }
          }));
        }
        var firstConnect = !wsHasConnected;
        wsHasConnected = true;
        wsOpenedAt = Date.now();
        setConnection('live');
        updateFooter();
        resyncAfterConnect(firstConnect);
      };
      ws.onmessage = function(e) {
        if (state.ws !== ws) return;
        if (!ws.__usable) {
          ws.__usable = true;
          directFailures = 0;
        }
        store.lastEventAt = Date.now();
        try {
          var msg = JSON.parse(e.data);
          if (msg.type === 'stream' && msg.event) {
            handleStreamEvent(msg);
          } else if (msg.event_type && msg.data) {
            handleStreamEvent({ event: { type: 'create', data: msg.data, event_type: msg.event_type } });
          }
        } catch {}
      };
      ws.onclose = function() {
        clearTimeout(connectTimer);
        if (state.ws !== ws) return;
        wsOpenedAt = null;
        updateFooter();
        directFailures += 1;
        if (directFailures >= DIRECT_FAILURE_THRESHOLD) {
          directFailed = ws.__direct;
          directFailures = 0;
        }
        scheduleReconnect();
      };
      ws.onerror = function() {
        if (state.ws !== ws) return;
        try { ws.close(); } catch {}
      };
      state.ws = ws;
    }

    var resyncing = null;
    async function resyncAfterConnect(firstConnect) {
      openBootGate();
      if (resyncing) return resyncing;
      var reloadKinds = Object.keys(store.loaded).filter(function(k) { return store.loaded[k]; });
      resyncing = (async function() {
        try {
          await loadSnapshot();
          scheduleHealthStaleCheck();
          if (!firstConnect || reloadKinds.length) {
            reloadKinds.forEach(function(k) { store.loaded[k] = false; });
            await Promise.all(reloadKinds.map(ensureLoaded));
            state.graph.dirty = state.graph.loaded;
            state.activity.loaded = false;
            frontierStale = true;
            TAB_IDS.forEach(function(t) { tabDirty[t] = true; });
          }
          showTab(state.activeTab);
          updateFooter();
        } finally {
          resyncing = null;
        }
      })();
      return resyncing;
    }

    var LIVE_BUFFER_MAX = 200;

    function looksLikeObservation(obj) {
      return !!(obj && typeof obj === 'object' && obj.id && obj.timestamp);
    }

    function sessionKey(s) {
      return s && (s.id || s.sessionId);
    }

    function entityKey(kind, row) {
      if (!row) return '';
      if (kind === 'session') return sessionKey(row) || '';
      return row.id || '';
    }

    function applyEntityEvent(entities, kind, action, id, row) {
      var bucket = entities[kind];
      if (!bucket || !id) return false;
      var gone = action === 'deleted' || !row || (kind === 'lesson' && row.deleted === true);
      if (gone) {
        if (!bucket[id]) return false;
        delete bucket[id];
        return true;
      }
      bucket[id] = Object.assign({}, bucket[id] || {}, row);
      return true;
    }

    var ROW_EVENT_KINDS = ['lesson', 'action', 'crystal', 'semantic', 'procedural', 'audit'];

    function reduceLiveEvent(s, type, data) {
      var dot = type.indexOf('.');
      var kind = dot > 0 ? type.slice(0, dot) : type;
      var action = dot > 0 ? type.slice(dot + 1) : '';
      data = data || {};
      if (kind === 'memory') {
        var memId = data.memoryId || (data.memory && data.memory.id) || '';
        var memRow = action === 'deleted' ? null : (data.memory || null);
        if (!memRow && action !== 'deleted') return null;
        applyEntityEvent(s.entities, 'memory', action, memId, memRow);
        return { kind: 'memory', id: memId, action: action, row: memRow };
      }
      if (ROW_EVENT_KINDS.indexOf(kind) >= 0) {
        var row = action === 'deleted' ? null : (data[kind] || null);
        applyEntityEvent(s.entities, kind, action, data.id, row);
        return { kind: kind, id: data.id, action: action, row: row };
      }
      if (kind === 'session') {
        if (action === 'updated' && data.session) {
          var sid = sessionKey(data.session);
          applyEntityEvent(s.entities, 'session', 'updated', sid, data.session);
          return { kind: 'session', id: sid, action: 'updated', row: data.session };
        }
        if (action === 'deleted' && data.sessionId) {
          applyEntityEvent(s.entities, 'session', 'deleted', data.sessionId, null);
          return { kind: 'session', id: data.sessionId, action: 'deleted', row: null };
        }
        if (action === 'activity' && data.sessionId) {
          var existing = s.entities.session[data.sessionId];
          if (existing) {
            existing.observationCount = data.observationCount;
            if (data.updatedAt) existing.updatedAt = data.updatedAt;
          }
          return { kind: 'session', id: data.sessionId, action: 'activity', row: existing || null };
        }
        return null;
      }
      if (type === 'counts.changed' && data.counts) {
        s.counts = data.counts;
        return { kind: 'counts' };
      }
      if (type === 'health') {
        s.status = data.status || s.status;
        if (data.health) s.health = data.health;
        if (data.circuitBreaker !== undefined) s.circuitBreaker = data.circuitBreaker;
        if (Array.isArray(data.functionMetrics)) s.functionMetrics = data.functionMetrics;
        if (data.counts) s.counts = data.counts;
        if (data.indexes) s.indexes = data.indexes;
        if (data.report) s.report = data.report;
        s.lastHealthAt = Date.now();
        return { kind: 'health' };
      }
      if (type === 'graph.changed') {
        if (data.source === 'snapshot') {
          s.graph = { stats: data.stats || null, updatedAt: data.updatedAt, resetAt: data.resetAt || null };
        }
        return { kind: 'graph', source: data.source };
      }
      if (type === 'consolidation.run') {
        s.consolidation = { lastRun: data.lastRun || null };
        if (data.status) s.consolidationStatus = data.status;
        return { kind: 'consolidation' };
      }
      return null;
    }

    function feedFromChange(change) {
      if (!change || !change.row) {
        if (change && change.kind === 'memory' && change.action === 'deleted') feedPush({ tag: 'forget', badge: 'badge-red', text: '记忆已删除' });
        return;

      var r = change.row;
      if (change.kind === 'memory' && change.action === 'created') feedPush({ tag: 'memory', badge: 'badge-green', text: truncate(r.title || r.content || '记忆已保存', 90), kind: 'memory', id: change.id });
      else if (change.kind === 'lesson' && change.action === 'created') feedPush({ tag: 'lesson', badge: 'badge-purple', text: truncate(r.content || '学到新经验', 90), kind: 'lesson', id: change.id });
      else if (change.kind === 'action' && change.action === 'created') feedPush({ tag: 'action', badge: 'badge-yellow', text: truncate(r.title || '新建行动', 90), kind: 'action', id: change.id });
      else if (change.kind === 'crystal' && change.action === 'created') feedPush({ tag: 'crystal', badge: 'badge-cyan', text: truncate(r.narrative || '结晶已保存', 90), kind: 'crystal', id: change.id });
      else if (change.kind === 'audit' && change.action === 'created') feedPush(auditFeedItem(r));
      else if (change.kind === 'session' && change.action === 'updated') {
        var label = r.status === 'completed' ? '会话已结束' : '会话运行中';
        feedPush({ tag: 'session', badge: r.status === 'active' ? 'badge-green' : 'badge-blue', text: label + ': ' + sessionDisplayName(r), kind: 'session', id: change.id });

    }

    function recordEvent(type, data) {
      var dot = type.indexOf('.');
      var entry = { seq: ++eventSeq, type: type, kind: dot > 0 ? type.slice(0, dot) : type, data: data };
      eventLog.push(entry);
      if (eventLog.length > EVENT_LOG_MAX) eventLog.shift();
      return entry;
    }

    function handleLiveEvent(type, data) {
      recordEvent(type, data);
      var memPrev = null;
      if (type.indexOf('memory.') === 0 && data) {
        var memPrevId = data.memoryId || (data.memory && data.memory.id);
        if (memPrevId && store.entities.memory[memPrevId]) memPrev = Object.assign({}, store.entities.memory[memPrevId]);
      }
      var sesPrev = null;
      if ((type === 'session.updated' || type === 'session.deleted') && data) {
        var sesPrevId = type === 'session.deleted' ? data.sessionId : sessionKey(data.session);
        if (sesPrevId && store.entities.session[sesPrevId]) sesPrev = Object.assign({}, store.entities.session[sesPrevId]);
      }
      var change = reduceLiveEvent(store, type, data);
      if (!change) return;
      if (change.kind === 'memory') {
        noteMemoryChange(memPrev, store.entities.memory[change.id] || null, change.id);
        noteSessionProduced(change);
      }
      if (change.kind === 'audit' && change.action === 'created') state.audit.fresh[change.id] = Date.now();
      if ((change.kind === 'lesson' || change.kind === 'action' || change.kind === 'crystal') && change.action !== 'deleted' && change.id) state.freshRows[change.id] = Date.now();
      if (change.kind === 'session' && change.action !== 'activity') adjustSessionFacets(sesPrev, change.row);
      if (change.kind !== 'session' || change.action !== 'activity') feedFromChange(change);
      if (change.kind === 'action') frontierStale = true;
      if (change.kind === 'graph') handleGraphChange(data);
      if (change.kind === 'consolidation' && !store.consolidationStatus) ensureConsolidationStatus(true);
      if (change.kind === 'health') scheduleHealthStaleCheck();
      if (change.kind === 'counts' || change.kind === 'health') updateCountBadges();
      markDirty(KIND_TABS[change.kind] || []);
      if (state.activeTab === 'dashboard') markDirty(['dashboard']);
    }

    function handleStreamEvent(msg) {
      var evt = msg.event;
      var observation;
      if (!evt) return;
      if (evt.type === 'event' && evt.event && evt.event.type) {
        if (evt.event.type === 'raw_observation') {
          observation = evt.event.data && (evt.event.data.observation || evt.event.data);
          if (looksLikeObservation(observation)) routeWsMessage({ observation: observation });
          return;
        }
        handleLiveEvent(evt.event.type, evt.event.data || {});
        return;
      }
      if (evt.event_type && evt.event_type !== 'observation' && evt.event_type !== 'create' && evt.event_type !== 'update') {
        return;
      }
      if (evt.type === 'event' && evt.data) {
        observation = evt.data.observation || evt.data;
        if (looksLikeObservation(observation)) {
          routeWsMessage({ observation: observation });
        }
        return;
      }
      if ((evt.type === 'create' || evt.type === 'update') && evt.data) {
        var payload = evt.data;
        observation = payload.observation || payload;
        if (looksLikeObservation(observation)) {
          routeWsMessage({ observation: observation, fresh: true });
        }
      } else if (evt.type === 'sync') {
        var items = Array.isArray(evt.data) ? evt.data.slice(-LIVE_BUFFER_MAX) : [];
        items.forEach(function(item) {
          var payload = item.data || item;
          observation = payload.observation || payload;
          if (looksLikeObservation(observation)) {
            routeWsMessage({ observation: observation });
          }
        });
      }
    }

    function routeWsMessage(msg) {
      var o = msg.observation;
      if (!o) return;
      if (msg.fresh && (o.title || o.narrative)) {
        var obsSession = store.entities.session[o.sessionId];
        var obsWhat = (o.title || '观测') + (o.subtitle ? ': ' + humanizeSubtitle(o.subtitle) : '');
        feedPush({ at: o.timestamp, tag: String(o.type || 'observation').replace(/_/g, ' '), badge: 'badge-blue', text: truncate(obsWhat + (obsSession ? ' (' + sessionDisplayName(obsSession) + ')' : ''), 110), kind: 'session', id: o.sessionId });
        markDirty(['dashboard']);
      }
      liveSessionObservation(o);
      if (state.activity.loaded) {
        var idx = state.activity.observations.findIndex(function(x) { return x.id === o.id; });
        if (idx >= 0) state.activity.observations[idx] = o;
        else state.activity.observations.unshift(o);
        if (state.activity.observations.length > LIVE_BUFFER_MAX * 5) {
          state.activity.observations.length = LIVE_BUFFER_MAX * 5;
        }
        markDirty(['activity']);
      }
    }

    function copyText(text, btn) {
      function done(ok) {
        if (!btn) return;
        var prev = btn.getAttribute('data-label') || btn.textContent;
        btn.setAttribute('data-label', prev);
        btn.textContent = ok ? '已复制' : '复制失败';
        btn.classList.toggle('copied', ok);
        setTimeout(function() { btn.textContent = prev; btn.classList.remove('copied'); }, 1400);
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function() { done(true); }, function() { done(fallbackCopy(text)); });
      } else {
        done(fallbackCopy(text));
      }
    }

    function fallbackCopy(text) {
      try {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        var ok = document.execCommand('copy');
        document.body.removeChild(ta);
        return ok;
      } catch (_) {
        return false;
      }
    }

    function focusPageSearch() {
      var view = document.getElementById('view-' + state.activeTab);
      if (!view) return false;
      var input = view.querySelector('input[type="search"], input[type="text"], .graph-search');
      if (!input) return false;
      input.focus();
      if (input.select) input.select();
      return true;
    }

    function closeAllOverlays() {
      var hadOverlay = document.getElementById('modal-overlay').classList.contains('open');
      closeModal();
      hideHelpPop();
      closeNav();
      if (state.flagsOpen) {
        state.flagsOpen = false;
        renderFlagsChip();
        renderFlagsPanel();
        return true;
      }
      return hadOverlay;
    }

    var pendingGAt = 0;
    document.addEventListener('keydown', function(e) {
      if (e.defaultPrevented) return;
      var t = e.target;
      var typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable);
      if (e.key === 'Escape') {
        var closed = closeAllOverlays();
        if (!closed && typing && t.blur) t.blur();
        if (!closed && !typing && state.activeTab === 'memories' && state.memories.selectedId && !state.memories.editing) {
          state.memories.selectedId = null;
          setRouteEntity('memories', '');
          renderMemories();
        } else if (!closed && !typing && state.activeTab === 'lessons' && state.lessons.selectedId) {
          handlePageAction('lesson-close', document.body);
        } else if (!closed && !typing && state.activeTab === 'actions' && state.actions.selectedId) {
          handlePageAction('action-close', document.body);
        } else if (!closed && !typing && state.activeTab === 'audit' && state.audit.selectedIdx) {
          toggleAuditDetail(state.audit.selectedIdx);
        }
        return;
      }
      if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
      if (pendingGAt && Date.now() - pendingGAt < 1500) {
        pendingGAt = 0;
        var jump = TAB_SHORTCUTS[e.key.toLowerCase()];
        if (jump) {
          e.preventDefault();
          switchTab(jump);
        }
        return;
      }
      if (e.key === '/') {
        if (focusPageSearch()) e.preventDefault();
        return;
      }
      if (e.key === '?') {
        e.preventDefault();
        openHelpOverlay();
        return;
      }
      if (e.key === 'g') {
        pendingGAt = Date.now();
        return;
      }
      if (/^[1-9]$/.test(e.key) && state.activeTab !== 'replay') {
        var target = TAB_IDS[parseInt(e.key, 10) - 1];
        if (target) {
          e.preventDefault();
          switchTab(target);
        }
      }
    });

    document.addEventListener('mouseover', function(e) {
      if (!(e.target instanceof Element)) return;
      var btn = e.target.closest('[data-help]');
      if (btn && btn !== helpAnchor) showHelpPop(btn);
    });
    document.addEventListener('focusin', function(e) {
      if (!(e.target instanceof Element)) return;
      if (e.target.matches('[data-help]')) showHelpPop(e.target);
      else if (helpAnchor && !e.target.closest('#help-pop')) hideHelpPop();
    });
    document.addEventListener('mouseout', function(e) {
      if (!(e.target instanceof Element) || !helpAnchor) return;
      var from = e.target.closest('[data-help]');
      var to = e.relatedTarget instanceof Element ? e.relatedTarget.closest('[data-help], #help-pop') : null;
      if (from && !to && document.activeElement !== from) hideHelpPop();
    });

    document.addEventListener('click', function(e) {
      if (!(e.target instanceof Element)) return;
      var copyEl = e.target.closest('[data-copy]');
      if (copyEl) {
        e.preventDefault();
        e.stopPropagation();
        copyText(copyEl.getAttribute('data-copy') || '', copyEl);
        return;
      }
      var helpEl = e.target.closest('[data-help]');
      if (helpEl) {
        e.preventDefault();

        if (helpAnchor === helpEl && !document.getElementById('help-pop').hidden) hideHelpPop();

        return;
      }
      if (!e.target.closest('#help-pop')) hideHelpPop();
      var replayLink = e.target.closest('[data-replay-session]');
      if (replayLink) {
        e.preventDefault();
        var replayId = replayLink.getAttribute('data-replay-session');
        switchTab('replay');
        if (replayId) selectReplaySession(replayId);
        return;
      }
      if (!e.target.closest('#tab-bar, #nav-toggle')) closeNav();
      var target = e.target.closest('[data-action]');
      if (!target) return;
      var action = target.getAttribute('data-action');
      if (!action) return;

      if (action === 'toggle-theme') {
        toggleTheme();
        return;
      }
      if (action === 'toggle-nav') {
        toggleNav();
        return;
      }
      if (action === 'open-help') {
        openHelpOverlay();
        return;
      }
      if (action === 'toggle-flags') {
        state.flagsOpen = !state.flagsOpen;
        renderFlagsChip();
        renderFlagsPanel();
        return;
      }
      if (action === 'reconnect-now') {
        reconnectNow();
        return;
      }
      if (action === 'memories-load-more') {
        loadMoreMemories();
        return;
      }
      if (action === 'sessions-load-more') {
        loadMoreSessions();
        return;
      }
      if (action === 'refresh-health') {
        ensureStatusReport();
        return;
      }
      if (action === 'run-consolidation') {
        runConsolidation();
        return;
      }
      if (action === 'zoom-graph') {
        zoomGraph(parseInt(target.getAttribute('data-dir') || '0', 10));
        return;
      }
      if (action === 'recenter-graph') {
        recenterGraph();
        return;
      }
      if (action === 'rebuild-graph') {
        rebuildGraph();
        return;
      }
      if (action.indexOf('graph-') === 0 && handleGraphAction(action, target)) {
        return;
      }
      if (action.indexOf('mem-') === 0) {
        handleMemoryAction(action, target);
        return;
      }
      if (action === 'close-modal') {
        closeModal();
        return;
      }
      if (action === 'save-viewer-token') {
        var tokenInput = document.getElementById('viewer-auth-token');
        var token = tokenInput ? tokenInput.value.trim() : '';
        if (token) {
          setViewerToken(token);
          hideViewerAuthPrompt();
          resyncAfterConnect(false);
        }
        return;
      }
      if (action.indexOf('ses-') === 0) {
        handleSessionAction(action, target);
        return;
      }
      if (action === 'select-session') {
        var sessionId = target.getAttribute('data-session-id');
        if (sessionId) selectSession(sessionId);
        return;
      }
      if (action === 'goto-tab') {
        var gotoTab = target.getAttribute('data-tab');
        if (gotoTab) switchTab(gotoTab);
        return;
      }
      if (action === 'select-lesson') {
        var lsnId = target.getAttribute('data-lesson-id');
        if (lsnId) {
          state.lessons.selectedId = state.lessons.selectedId === lsnId ? null : lsnId;
          state.lessons.notice = null;

        var memId = target.getAttribute('data-memory-id');
        if (memId) {
          state.memories.selectedId = state.memories.selectedId === memId ? null : memId;
          if (state.memories.editing && state.memories.editing.id !== state.memories.selectedId) state.memories.editing = null;
          state.memories.error = '';

      if (action === 'audit-load-more') { loadMoreAudit(); return; }
      if (action === 'audit-clear-filters') { clearAuditFilters(); return; }

      if (action === 'replay-select') {
        var rSid = target.getAttribute('data-session-id');
        if (rSid) selectReplaySession(rSid);
        return;
      }
      if (action === 'replay-toggle-play') { toggleReplayPlay(); return; }
      if (action === 'replay-step') {
        var d = parseInt(target.getAttribute('data-dir') || '1', 10);
        stepReplay(d);
        return;
      }
      if (action === 'replay-speed') {
        var sp = parseFloat(target.getAttribute('data-speed') || '1');

    function replaySessions() {

    }

      html += '<div class="toolbar" style="margin-bottom:8px;"><input type="text" id="replay-import-path" placeholder=".jsonl 转录文件或其所在文件夹的路径；留空则使用 ~/.claude/projects" value="' + esc(r.importPath || '') + '" style="flex:1;min-width:0;" aria-label="要导入的转录文件或文件夹" aria-describedby="replay-import-status">';

      html += '<div class="empty-step-label">从终端执行相同的调用：</div>' + cmdBlock(curlPost('replay/import-jsonl', { path: r.importPath || '~/.claude/projects' }));

    function replayDetailHtml(ev) {
      if (!ev) return '<div class="empty-step-label">在左侧选择一个事件。</div>';
      var html = '<div class="mem-detail-head"><span class="badge ' + ({ prompt: 'badge-blue', response: 'badge-green', tool_call: 'badge-orange', tool_error: 'badge-red' }[ev.kind] || 'badge-muted') + '">' + esc(String(ev.kind || '').replace(/_/g, ' ')) + '</span><span>' + esc(ev.label || '') + '</span>' + (ev.ts ? '<span>· ' + esc(formatTime(ev.ts)) + '</span>' : '') + '</div>';

      if (ev.toolInput !== undefined && ev.toolInput !== null) {
        var input = ev.toolInput;
        if (typeof input === 'string') { try { var parsed = JSON.parse(input); if (parsed && typeof parsed === 'object') input = parsed; } catch (_) {} }
        html += typeof input === 'object' ? obsFieldsHtml(input, '', '') : obsCodeHtml(input, 'Input');
      }
      if (ev.toolOutput !== undefined && ev.toolOutput !== null) html += obsCodeHtml(typeof ev.toolOutput === 'string' ? ev.toolOutput : JSON.stringify(ev.toolOutput, null, 2), ev.kind === 'tool_error' ? 'Error' : '输出');

    function renderReplay() {
      var el = document.getElementById('view-replay');

      if (!store.loaded.session) { setViewHtml(el, skeleton(8)); return; }
      var sessions = replaySessions();
      var focusAction = document.activeElement && el.contains(document.activeElement) ? document.activeElement.getAttribute('data-action') : '';
      var focusKey = focusAction ? (document.activeElement.getAttribute('data-speed') || document.activeElement.getAttribute('data-dir') || '') : '';
      var html = sessions.length ? '<div class="inline-note"><strong>回放</strong> ' + help('replay') + ' 按真实时间节奏逐步回放录制好的会话：提示、响应和工具调用按顺序呈现。适用于所有已连接智能体的会话。<kbd>Space</kbd> 播放/暂停，<kbd>&larr;</kbd> <kbd>&rarr;</kbd> 单步。</div>' : '';
      if (sessions.length) {
        html += '<div class="toolbar"><select id="replay-session-select" aria-label="要回放的会话" style="flex:1;min-width:0;max-width:720px;"><option value="">选择会话…</option>' + sessions.map(function(s) {
          var id = sessionId(s);
          return '<option value="' + esc(id) + '"' + (id === r.selectedId ? ' selected' : '') + '>' + esc(sessionPickerLabel(s)) + '</option>';
        }).join('') + '</select>';
        if (r.selectedId) html += '<a class="btn" href="' + entityHref('session', r.selectedId) + '">打开会话</a>';
        html += '</div>';
      }
      var tl = r.timeline;
      if (r.selectedId && r.loadingTimeline) {
        html += '<div class="inline-status" role="status">正在加载回放：' + esc(shortId(r.selectedId, 24)) + '…</div>' + skeleton(6);
      } else if (r.selectedId && r.loadError) {
        html += '<div class="inline-status err" role="alert">' + r.loadError + '</div>';
      } else if (r.selectedId && tl && !(tl.events && tl.events.length)) {
        html += emptyState({
          compact: true,
          icon: '&#9654;',
          title: '此会话没有可回放的内容',
          what: '回放将逐步呈现会话中记录的提示、响应和工具调用。',
          why: '此会话未捕获到提示或工具调用，因此时间线为空。',
          steps: [{ label: '从终端查看其观测：', cmd: curlGet('observations?sessionId=' + encodeURIComponent(r.selectedId) + '&limit=20') }]
        });
      } else if (tl && tl.events && tl.events.length) {
        var cursorEvent = tl.events[Math.min(r.cursor, tl.events.length - 1)];
        var progress = tl.totalDurationMs > 0 ? Math.min(100, (r.offsetAt / tl.totalDurationMs) * 100) : 0;
        html += '<div class="replay-controls" role="toolbar" aria-label="播放控制">';
        html += '<button type="button" data-action="replay-step" data-dir="-1" aria-label="上一个事件">&#9664;</button>';
        html += '<button type="button" data-action="replay-toggle-play" aria-pressed="' + (r.playing ? 'true' : 'false') + '">' + (r.playing ? '&#10074;&#10074; 暂停' : '&#9654; 播放') + '</button>';
        html += '<button type="button" data-action="replay-step" data-dir="1" aria-label="下一个事件">&#9654;</button>';
        html += '<button type="button" data-action="replay-reset" aria-label="回到开头">&#10226;</button><span class="sep"></span><span id="replay-speed-label">速度</span>';
        ['0.5', '1', '2', '4'].forEach(function(sp) {
          var on = Math.abs(r.speed - parseFloat(sp)) < 0.01;
          html += '<button type="button" data-action="replay-speed" data-speed="' + sp + '" aria-pressed="' + (on ? 'true' : 'false') + '" aria-describedby="replay-speed-label">' + sp + '&times;</button>';
        });
        html += '<span class="sep"></span><span aria-live="polite">事件 ' + (r.cursor + 1) + ' / ' + tl.eventCount + ' · ' + (r.offsetAt / 1000).toFixed(1) + '秒 / ' + (tl.totalDurationMs / 1000).toFixed(1) + '秒</span></div>';
        html += '<div class="replay-progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + Math.round(progress) + '" aria-label="播放进度"><div class="replay-progress-bar" style="width:' + progress.toFixed(1) + '%"></div></div>';
        html += '<div class="replay-grid"><div class="replay-list" id="replay-list">';
        tl.events.forEach(function(ev, i) {
          html += '<button type="button" class="replay-event replay-event-' + esc(ev.kind) + (i === r.cursor ? ' replay-event-active' : '') + '" data-action="replay-jump" data-replay-idx="' + i + '" aria-current="' + (i === r.cursor ? 'step' : 'false') + '">' +
            '<span class="replay-event-kind">' + esc(String(ev.kind || '').replace(/_/g, ' ')) + '</span><span class="replay-event-label">' + esc(ev.label) + '</span><span class="replay-event-time">' + (ev.offsetMs / 1000).toFixed(1) + '秒</span></button>';
        });
        html += '</div><div class="replay-detail">' + replayDetailHtml(cursorEvent) + '</div></div>';
      } else {
        html += replayIntroHtml(sessions);

      html += replayImportHtml();
      setViewHtml(el, html);
      var sel = document.getElementById('replay-session-select');
      if (sel && !sel.__bound) {
        sel.__bound = true;
        sel.addEventListener('change', function() { selectReplaySession(sel.value); });
      }

      if (imp && !imp.__bound) {
        imp.__bound = true;
        imp.addEventListener('input', function() { state.replay.importPath = imp.value; });
        imp.addEventListener('keydown', function(e) { if (e.key === 'Enter') { e.preventDefault(); runReplayImport(); } });
      }
      var details = document.getElementById('replay-import');
      if (details && !details.__bound) {
        details.__bound = true;
        details.addEventListener('toggle', function() { state.replay.importOpen = details.open; });
      }
      var active = el.querySelector('.replay-event-active');
      var list = document.getElementById('replay-list');
      if (active && list) {
        var top = active.offsetTop - list.offsetTop;
        if (top < list.scrollTop || top > list.scrollTop + list.clientHeight - active.offsetHeight) list.scrollTop = Math.max(0, top - list.clientHeight / 2);

        if (again && document.activeElement !== again) again.focus();
      }
    }

    async function selectReplaySession(id) {
      var r = state.replay;
      stopReplayTimer();
      r.selectedId = id;
      r.timeline = null;
      r.cursor = 0;
      r.offsetAt = 0;
      r.playing = false;
      r.loadError = '';
      if (!id) { renderReplay(); return; }
      r.loadingTimeline = true;
      renderReplay();
      var res = await apiGet('replay/load?sessionId=' + encodeURIComponent(id));
      if (r.selectedId !== id) return;
      r.loadingTimeline = false;
      if (res && res.success && res.timeline) r.timeline = res.timeline;
      else if (res && res.error) r.loadError = '无法加载此会话：' + esc(res.error) + '.';
      else if (!res) r.loadError = '回放请求失败。请确认 agentmemory 正在运行，然后重新选择会话。';
      else r.timeline = { events: [], eventCount: 0, totalDurationMs: 0 };
      renderReplay();
    }

    function toggleReplayPlay() {
      var r = state.replay;
      if (!r.timeline || !r.timeline.eventCount) return;
      if (r.playing) stopReplayTimer();
      else {
        if (r.offsetAt >= r.timeline.totalDurationMs) { r.cursor = 0; r.offsetAt = 0; }
        startReplayTimer();
      }
      renderReplay();
    }

    function startReplayTimer() {
      var r = state.replay;
      r.playing = true;
      r.startAt = Date.now();
      var baseOffset = r.offsetAt;
      if (r.timer) clearInterval(r.timer);
      r.timer = setInterval(function() {
        if (!r.timeline) return;
        r.offsetAt = baseOffset + (Date.now() - r.startAt) * r.speed;
        var events = r.timeline.events;
        var next = r.cursor;
        for (var i = next; i < events.length; i++) {
          if (events[i].offsetMs <= r.offsetAt) next = i;
          else break;
        }
        var changed = next !== r.cursor;
        r.cursor = next;
        if (r.offsetAt >= r.timeline.totalDurationMs) {
          r.offsetAt = r.timeline.totalDurationMs;
          stopReplayTimer();
          renderReplay();
          return;
        }
        if (changed) renderReplay();
      }, 100);
    }

    function stopReplayTimer() {
      state.replay.playing = false;
      if (state.replay.timer) {
        clearInterval(state.replay.timer);
        state.replay.timer = null;
      }
    }

    function jumpReplay(idx) {
      var r = state.replay;
      if (!r.timeline || !r.timeline.eventCount) return;
      stopReplayTimer();
      r.cursor = Math.max(0, Math.min(idx, r.timeline.eventCount - 1));
      r.offsetAt = r.timeline.events[r.cursor].offsetMs;
      renderReplay();
    }

    function stepReplay(dir) {
      if (!state.replay.timeline) return;
      jumpReplay(state.replay.cursor + dir);
    }

    function setReplaySpeed(sp) {
      if (!sp || sp <= 0) return;
      var wasPlaying = state.replay.playing;
      stopReplayTimer();
      state.replay.speed = sp;
      if (wasPlaying) startReplayTimer();
      renderReplay();
    }

    function resetReplay() {
      stopReplayTimer();
      state.replay.cursor = 0;
      state.replay.offsetAt = 0;
      renderReplay();
    }

    async function runReplayImport() {
      var r = state.replay;
      if (r.importing) return;
      var input = document.getElementById('replay-import-path');
      var pathVal = input ? input.value.trim() : String(r.importPath || '').trim();
      r.importPath = pathVal;
      r.importing = true;
      r.importOpen = true;
      r.importStatus = { html: '正在导入 ' + esc(pathVal || '~/.claude/projects') + '…大文件夹可能需要一分钟。' };
      renderReplay();
      var res = await api('replay/import-jsonl', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(pathVal ? { path: pathVal } : {}), readErrorBody: true });
      r.importing = false;
      if (!res || res.success === false || res.error) {
        var reason = res && res.error ? String(res.error) : '请求失败。请确认 agentmemory 正在运行。';
        var hint = /not found/.test(reason) ? ' 请检查路径；该路径在 agentmemory 运行的机器上读取。' : /\.jsonl/.test(reason) ? ' 请将其指向单个 .jsonl 文件或包含此类文件的文件夹。' : '';
        r.importStatus = { err: true, html: '导入失败：' + esc(reason.replace(/[.\s]+$/, '')) + '.' + hint };
      } else if (!res.imported) {
        r.importStatus = { err: true, html: '在以下路径下未找到 .jsonl 转录文件：' + esc(pathVal || '~/.claude/projects') + '。未导入任何内容。' };
      } else {
        var ids = res.sessionIds || [];
        r.importStatus = { html: '已导入 ' + fmtNum(res.imported) + ' 个文件' + '' + '，包含 ' + fmtNum(res.observations || 0) + ' 条观测' + (res.truncated ? '（在 ' + fmtNum(res.maxFiles) + ' 个文件处停止；传入 maxFiles 可导入更多）' : '') + '. ' + (ids.length ? '新会话：' + ids.slice(0, 6).map(function(id) { return '<a class="entity-link" href="#replay" data-replay-session="' + esc(id) + '">' + esc(shortId(id, 18)) + '</a>'; }).join(' ') + (ids.length > 6 ? ' +' + (ids.length - 6) + ' 个' : '') + '。它们也会出现在会话页。' : '') };
      }
      renderReplay();
    }

    document.addEventListener('keydown', function(e) {
      if (state.activeTab !== 'replay') return;
      var t = e.target;
      if (t && (t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA' || t.tagName === 'SUMMARY' || (t.tagName === 'BUTTON' && e.key === ' '))) return;
      if (document.getElementById('modal-overlay').classList.contains('open')) return;
      if (e.key === ' ') { e.preventDefault(); toggleReplayPlay(); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); stepReplay(-1); }
      else if (e.key === 'ArrowRight') { e.preventDefault(); stepReplay(1); }
    });

    var bootRoute = parseRoute(window.location.hash);
    switchTab(bootRoute.tab, { replaceRoute: true, skipRoute: !!bootRoute.obs && !bootRoute.redirect, id: bootRoute.id, obs: bootRoute.obs });
    (async function initWs() {
      try {
        var live = await api('livez', { signal: AbortSignal.timeout(5000) });
        if (live && typeof live.streamsPort === 'number' && live.streamsPort > 0) {
          WS_URL = wsProto + '//' + window.location.hostname + ':' + live.streamsPort;
          WS_DIRECT_URL = WS_URL + '/stream/mem-live/viewer';
        }
      } catch (_) {}
      connectWs();
    })();
    setTimeout(function() {
      if (wsHasConnected) return;
      openBootGate();
      loadSnapshot();
      showTab(state.activeTab);
    }, 4000);

    document.addEventListener('visibilitychange', function() {
      if (document.visibilityState !== 'visible') return;
      var ws = state.ws;
      if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;
      wsRetries = 0;
      reconnectNow();
    });

    setInterval(function() {
      document.querySelectorAll('time.rel-time[datetime]').forEach(function(el) {
        var text = timeAgo(el.getAttribute('datetime'));
        if (el.textContent !== text) el.textContent = text;
      });
      if (conn.state === 'live') renderConnection();
    }, 15000);

    // Ambient background: an ordered-dither dot field that drifts very
    // slowly — the print-halftone cousin of the old static dot grid.
    // Renders at quarter resolution and ~12fps; a single static frame
    // under prefers-reduced-motion.
    (function ditherField() {
      var cv = document.getElementById('bg-dither');
      if (!cv || !cv.getContext) return;
      var ctx = cv.getContext('2d');
      var BAYER = [
        [0, 8, 2, 10],
        [12, 4, 14, 6],
        [3, 11, 1, 9],
        [15, 7, 13, 5]
      ];
      var CELL = 7;
      var t = 0;
      var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      function dotColor() {
        return document.documentElement.getAttribute('data-theme') === 'dark'
          ? 'rgba(150, 154, 162, 0.16)'
          : 'rgba(90, 90, 84, 0.14)';
      }

      function draw() {
        var w = cv.width = Math.ceil(window.innerWidth / 2);
        var h = cv.height = Math.ceil(window.innerHeight / 2);
        ctx.clearRect(0, 0, w, h);
        ctx.fillStyle = dotColor();
        var cols = Math.ceil(w / CELL) + 1;
        var rows = Math.ceil(h / CELL) + 1;
        for (var y = 0; y < rows; y++) {
          for (var x = 0; x < cols; x++) {
            // Slow luminance swells drifting diagonally; the Bayer
            // threshold turns them into stable ordered-dither dots.
            var v =
              0.5 +
              0.5 *
                Math.sin(x * 0.11 + t * 0.013) *
                Math.cos(y * 0.13 - t * 0.011);
            if (v * 16 > BAYER[y % 4][x % 4] + 6.5) {
              ctx.fillRect(x * CELL, y * CELL, 1.4, 1.4);
            }
          }
        }
      }

      draw();
      var lastFrame = 0;
      function frame(now) {
        if (document.hidden) return;
        if (now - lastFrame >= 85) {
          lastFrame = now;
          t++;
          draw();
        }
        requestAnimationFrame(frame);
      }
      if (!reduced) {
        requestAnimationFrame(frame);
        document.addEventListener('visibilitychange', function() {
          if (!document.hidden) requestAnimationFrame(frame);
        });
      }
      window.addEventListener('resize', draw);
      new MutationObserver(draw).observe(document.documentElement, {
        attributes: true,
        attributeFilter: ['data-theme']
      });
    })();
  </script>
</body>
