<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>agentmemory 查看器</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    :root {
      --bg: #F9F9F7;
      --bg-alt: #F0F0EC;
      --bg-subtle: #F4F4F0;
      --bg-inset: #E8E8E3;
      --border: #111111;
      --border-light: #D4D4CF;
      --border-heavy: #111111;
      --ink: #111111;
      --ink-secondary: #333333;
      --ink-muted: #666666;
      --ink-faint: #999999;
      --accent: #CC0000;
      --accent-light: #FF1A1A;
      --cream: #F5F0E8;
      --node-file: #2D6A4F;
      --node-function: #1D4E89;
      --node-concept: #B8860B;
      --node-error: #CC0000;
      --node-decision: #6B3FA0;
      --node-pattern: #2563EB;
      --node-library: #C2410C;
      --node-person: #111111;
      --green: #2D6A4F;
      --blue: #1D4E89;
      --yellow: #B8860B;
      --red: #CC0000;
      --purple: #6B3FA0;
      --orange: #C2410C;
      --cyan: #0E7490;
      --font-display: 'Playfair Display', Georgia, 'Times New Roman', serif;
      --font-body: 'Lora', Georgia, serif;
      --font-ui: 'Inter', -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', 'SF Mono', 'Fira Code', monospace;
    }
    html[data-theme="dark"] {
      --bg: #121316;
      --bg-alt: #1a1c20;
      --bg-subtle: #17181b;
      --bg-inset: #222428;
      --border: #33363b;
      --border-light: #26282c;
      --border-heavy: #c9cbd1;
      --ink: #eef0f3;
      --ink-secondary: #c6c9ce;
      --ink-muted: #94979d;
      --ink-faint: #6d7076;
      --accent: #f2555a;
      --accent-light: #ff7a70;
      --cream: #2a2520;
      --green: #5cc08f;
      --blue: #7fa9e3;
      --yellow: #dcae45;
      --red: #f2555a;
      --purple: #ae92dc;
      --orange: #e8905a;
      --cyan: #4ec0d2;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    #bg-dither {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
      opacity: 0.5;
    }
    .app-header, .tab-bar, .views, .view, .flags-panel, .offline-banner, footer, .app-footer { position: relative; z-index: 1; }
    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--ink-secondary);
      line-height: 1.6;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 0; }
    ::-webkit-scrollbar-thumb:hover { background: var(--ink-muted); }

    .app-header {
      padding: 10px 24px 0;
      border-bottom: 4px solid var(--border-heavy);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      background: var(--bg);
      flex: 0 0 auto;
      position: relative;
      z-index: 3;
    }
    .app-header > .tab-bar { flex: 1 1 100%; order: 10; margin: 8px -24px 0; border-bottom: none; border-top: 1px solid var(--border-light); }
    @media (max-width: 720px) {
      .app-header { padding-bottom: 8px; }
      .app-header > .tab-bar { margin: 0; border-top: none; }
    }
    .app-header .brand {
      display: flex;
      align-items: baseline;
      gap: 10px;
      color: inherit;
      text-decoration: none;
      cursor: pointer;
    }
    .app-header .brand:hover h1,
    .app-header .brand:focus-visible h1 { color: var(--accent); }
    .app-header .brand:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
    .app-header .brand h1 {
      font-size: 22px;
      color: var(--ink);
      font-weight: 900;
      font-family: var(--font-display);
      letter-spacing: -0.02em;
      text-transform: lowercase;
    }
    .app-header .brand .version {
      font-size: 10px;
      color: var(--ink-faint);
      font-family: var(--font-mono);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    @media (max-width: 720px) {
      .app-header { flex-wrap: wrap; row-gap: 6px; padding: 8px 16px; }
      .app-header .dateline { display: none; }
    }
    .ws-status {
      font-size: 10px;
      padding: 3px 10px;
      display: flex;
      align-items: center;
      gap: 5px;
      font-family: var(--font-ui);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 600;
      border: 1px solid var(--border-light);
    }
    .ws-status::before {
      content: '';
      width: 6px;
      height: 6px;
      display: inline-block;
    }
    .ws-status.connected { border-color: var(--green); color: var(--green); }
    .ws-status.connected::before { background: var(--green); animation: live-pulse 2.4s ease-in-out infinite; }
    @keyframes live-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    .ws-status.disconnected, .ws-status.connecting { border-color: var(--ink-faint); color: var(--ink-faint); }
    .ws-status.disconnected::before, .ws-status.connecting::before { background: var(--ink-faint); }
    .ws-status.reconnecting { border-color: var(--yellow); color: var(--yellow); }
    .ws-status.reconnecting::before { background: var(--yellow); }
    .ws-status.offline { border-color: var(--accent); color: var(--accent); }
    .ws-status.offline::before { background: var(--accent); }
    .ws-status.stale-health { border-color: var(--yellow); color: var(--yellow); }
    .ws-status.stale-health::before { background: var(--yellow); }

    .tab-bar {
      display: flex;
      align-items: stretch;
      height: 44px;
      flex-shrink: 0;
      border-bottom: 1px solid var(--border-light);
      background: var(--bg);
      overflow-x: auto;
      flex: 0 0 auto;
      position: relative;
      z-index: 2;
      padding: 0 12px;
      scrollbar-width: none;
    }
    .tab-bar::-webkit-scrollbar { display: none; }
    .tab-group { display: flex; align-items: stretch; border-left: 1px solid var(--border-light); padding-left: 6px; margin-left: 6px; }
    .tab-group-label {
      align-self: center;
      font-family: var(--font-ui);
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-faint);
      padding: 0 6px 0 4px;
      white-space: nowrap;
    }
    .tab-bar button {
      background: none;
      border: none;
      color: var(--ink-muted);
      padding: 8px 12px;
      font-size: 11px;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      white-space: nowrap;
      font-family: var(--font-ui);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-weight: 600;
      transition: color 0.15s, border-color 0.15s;
    }
    .tab-bar button:hover { color: var(--ink); }
    .tab-bar button:focus-visible { outline: 2px solid var(--accent); outline-offset: -4px; }
    .tab-bar button.active {
      color: var(--ink);
      border-bottom-color: var(--accent);
    }
    .tab-bar button .tab-count {
      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: 0;
      color: var(--ink-faint);
      margin-left: 5px;
      font-weight: 500;
    }
    .nav-toggle { display: none; }
    @media (max-width: 720px) {
      .nav-toggle { display: inline-flex; align-items: center; gap: 6px; order: 3; flex: 1 1 100%; justify-content: space-between; }
      .tab-bar {
        display: none;
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        height: auto;
        max-height: 70vh;
        overflow-y: auto;
        flex-direction: column;
        padding: 6px 12px 12px;
        border-bottom: 2px solid var(--border);
        box-shadow: 0 12px 24px rgba(0,0,0,0.12);
        z-index: 20;
      }
      .tab-bar.open { display: flex; }
      .tab-group { flex-direction: column; border-left: none; margin-left: 0; padding-left: 0; border-top: 1px solid var(--border-light); padding-top: 4px; margin-top: 4px; }
      .tab-group-label { align-self: flex-start; padding: 6px 12px 2px; }
      .tab-bar button { text-align: left; border-bottom: none; border-left: 2px solid transparent; padding: 9px 12px; }
      .tab-bar button.active { border-left-color: var(--accent); background: var(--bg-alt); }
      .app-shell-nav { position: relative; }
    }

    .views { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
    .view { display: none; flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 20px 24px; }
    .view.active { display: block; animation: view-in 160ms ease-out; }
    #view-graph.active { display: flex; flex-direction: column; padding: 0; overflow: hidden; }
    body.is-stale .view { filter: saturate(0.6); }
    @keyframes view-in {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .view.active { animation: none; }
      .ws-status.connected::before { animation: none; }
    }

    .layer-row { padding: 12px 0; border-bottom: 1px solid var(--border-light); }
    .layer-row:last-child { border-bottom: none; }
    .layer-head { display: flex; align-items: baseline; gap: 10px; }
    .layer-name { font-family: var(--font-display); font-weight: 700; font-size: 14px; color: var(--ink); }
    .layer-count { font-family: var(--font-mono); font-size: 13px; color: var(--ink); margin-left: auto; }
    .layer-from { font-size: 12px; color: var(--ink-muted); margin-top: 2px; }
    .layer-detail { font-size: 12px; color: var(--ink-faint); margin-top: 4px; line-height: 1.5; }
    .layer-preview { margin: 6px 0 0; padding-left: 16px; font-size: 12px; color: var(--ink-muted); }
    .layer-preview li { margin-bottom: 2px; }
    .verdict { display: flex; gap: 14px; align-items: flex-start; }
    .verdict-badge { font-family: var(--font-ui); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; padding: 4px 10px; border: 2px solid currentColor; flex-shrink: 0; }
    .verdict-badge.ok { color: var(--green); } .verdict-badge.info { color: var(--blue); } .verdict-badge.warn { color: var(--yellow); } .verdict-badge.error { color: var(--accent); } .verdict-badge.unknown { color: var(--ink-faint); }
    .verdict-text { font-family: var(--font-display); font-size: 17px; line-height: 1.4; color: var(--ink); }
    .verdict-meta { font-family: var(--font-ui); font-size: 11px; color: var(--ink-faint); margin-top: 4px; }
    .hstale { font-family: var(--font-ui); font-size: 12px; color: var(--ink); padding: 8px 12px; border-left: 3px solid var(--yellow); background: var(--bg-subtle); margin: 12px 0 0; line-height: 1.5; }
    .hstale.offline { border-left-color: var(--accent); }
    .problem { display: grid; grid-template-columns: 56px 1fr; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border-light); }
    .problem:last-child { border-bottom: none; }
    .problem .pm { font-size: 13px; color: var(--ink); line-height: 1.5; }
    .problem .pf { font-family: var(--font-ui); font-size: 12px; color: var(--ink-muted); margin-top: 3px; line-height: 1.5; }
    .problem .pf::before { content: 'Fix: '; font-weight: 700; color: var(--ink-secondary); }
    .hgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 16px; }
    .hgrid .card { margin: 0; min-width: 0; }
    .hnote { font-family: var(--font-ui); font-size: 11px; color: var(--ink-faint); line-height: 1.5; margin-top: 2px; }
    .hbar { height: 6px; background: var(--bg-inset); margin-top: 5px; position: relative; max-width: 260px; }
    .hbar > span { position: absolute; left: 0; top: 0; bottom: 0; background: var(--green); }
    .hbar.warn > span { background: var(--yellow); } .hbar.bad > span { background: var(--accent); }
    .flag-row { padding: 9px 0; border-bottom: 1px solid var(--bg-inset); }
    .flag-row:last-child { border-bottom: none; }
    .flag-head { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; font-size: 13px; }
    .flag-head code, .env-chip { font-family: var(--font-mono); font-size: 11px; color: var(--ink-secondary); background: var(--bg-inset); padding: 1px 5px; }
    .flag-how { font-family: var(--font-ui); font-size: 12px; color: var(--ink-muted); margin-top: 3px; line-height: 1.5; }
    .cflow { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 0; margin: 12px 0 4px; border: 1px solid var(--border-light); }
    .cstep { padding: 10px 12px; border-right: 1px solid var(--border-light); position: relative; min-width: 0; }
    .cstep:last-child { border-right: none; }
    .cstep-n { font-family: var(--font-ui); font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-faint); }
    .cstep-t { font-family: var(--font-display); font-weight: 700; font-size: 14px; color: var(--ink); margin: 2px 0 4px; }
    .cstep-d { font-family: var(--font-ui); font-size: 11px; color: var(--ink-muted); line-height: 1.5; }
    .cstep-c { font-family: var(--font-mono); font-size: 12px; color: var(--ink); margin-top: 6px; }
    .ccols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; margin-top: 14px; }
    .ccols h4 { font-family: var(--font-ui); font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-muted); margin-bottom: 6px; }
    .ckv { display: flex; gap: 10px; font-size: 12px; padding: 4px 0; border-bottom: 1px solid var(--bg-inset); font-family: var(--font-ui); }
    .ckv > span:first-child { color: var(--ink-muted); width: 150px; flex-shrink: 0; }
    .ckv > span:last-child { color: var(--ink); min-width: 0; overflow-wrap: anywhere; }
    @media (max-width: 900px) {
      .hgrid, .ccols { grid-template-columns: 1fr; }
      .cflow { grid-template-columns: 1fr; }
      .cstep { border-right: none; border-bottom: 1px solid var(--border-light); }
      .cstep:last-child { border-bottom: none; }
      .verdict { flex-direction: column; gap: 8px; }
      .ckv > span:first-child { width: 120px; }
    }
    .stats-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 1px;
      margin-bottom: 16px;
      border: 1px solid var(--border);
      background: var(--border-light);
    }
    .stat-card {
      background: var(--bg);
      padding: 12px 16px;
      flex: 1 1 150px;
      min-width: 0;
    }
    .stat-card .label .help { margin-left: 4px; }
    .stat-card[data-action] {
      cursor: pointer;
      transition: background 0.15s ease-out;
    }
    .stat-card[data-action]:hover { background: var(--bg-alt); }
    .stat-card[data-action]:hover .label { color: var(--accent); }
    .stat-card[data-action]:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
    .stat-card[data-action]:active { background: var(--bg-inset); }
    .stat-card .label {
      font-size: 9px;
      color: var(--ink-muted);
      text-transform: uppercase;
      letter-spacing: 0.15em;
      margin-bottom: 4px;
      font-family: var(--font-ui);
      font-weight: 600;
    }
    .stat-card .value {
      font-size: 32px;
      font-weight: 900;
      color: var(--ink);
      font-family: var(--font-display);
      line-height: 1.1;
    }
    .stat-card .sub {
      font-size: 11px;
      color: var(--ink-faint);
      margin-top: 2px;
      font-family: var(--font-ui);
    }

    .card {
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 20px;
      margin-bottom: 16px;
      transition: box-shadow 0.15s;
    }
    .card:hover {
      box-shadow: 4px 4px 0px 0px var(--border);
    }
    .card-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 12px;
      font-family: var(--font-display);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-light);
    }

    .health-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .health-dot {
      width: 10px;
      height: 10px;
    }
    .health-dot.healthy { background: var(--green); }
    .health-dot.degraded { background: var(--yellow); }
    .health-dot.critical { background: var(--accent); }

    .badge {
      display: inline-block;
      font-size: 9px;
      padding: 2px 8px;
      font-weight: 600;
      font-family: var(--font-ui);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      border: 1px solid;
    }
    .badge-blue { border-color: var(--blue); color: var(--blue); background: transparent; }
    .badge-green { border-color: var(--green); color: var(--green); background: transparent; }
    .badge-yellow { border-color: var(--yellow); color: var(--yellow); background: transparent; }
    .badge-red { border-color: var(--accent); color: var(--accent); background: transparent; }
    .badge-purple { border-color: var(--purple); color: var(--purple); background: transparent; }
    .badge-orange { border-color: var(--orange); color: var(--orange); background: transparent; }
    .badge-cyan { border-color: var(--cyan); color: var(--cyan); background: transparent; }
    .badge-muted { border-color: var(--border-light); color: var(--ink-muted); background: transparent; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      font-family: var(--font-body);
      font-variant-numeric: tabular-nums;
    }
    th {
      text-align: left;
      padding: 8px 12px;
      border-bottom: 2px solid var(--border);
      color: var(--ink);
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-weight: 600;
      font-family: var(--font-ui);
    }
    td {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border-light);
      vertical-align: top;
    }
    tr:hover td { background: var(--bg-alt); }

    .strength-bar {
      width: 60px;
      height: 4px;
      background: var(--bg-inset);
      overflow: hidden;
      display: inline-block;
      vertical-align: middle;
    }
    .strength-bar .fill {
      height: 100%;
      transition: width 0.3s;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      align-items: center;
      flex-wrap: wrap;
    }
    .toolbar input, .toolbar select, .search-input {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--ink);
      padding: 7px 12px;
      font-size: 13px;
      outline: none;
      font-family: var(--font-ui);
    }
    .toolbar input:focus, .toolbar select:focus, .search-input:focus {
      border-color: var(--ink);
      box-shadow: 2px 2px 0px 0px var(--border);
    }
    .toolbar input { flex: 1; min-width: 200px; }

    .btn, .toolbar button {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--ink);
      padding: 7px 16px;
      font-size: 11px;
      cursor: pointer;
      transition: box-shadow 0.1s, transform 0.1s;
      font-family: var(--font-ui);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .btn:hover, .toolbar button:hover { box-shadow: 3px 3px 0px 0px var(--border); transform: translate(-1px, -1px); }
    .btn:active, .toolbar button:active { box-shadow: none; transform: translate(0, 0); }
    .btn-danger { border-color: var(--accent); color: var(--accent); }
    .btn-danger:hover { background: var(--accent); color: white; box-shadow: 3px 3px 0px 0px var(--border); }
    .btn-primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
    .btn-primary:hover { background: var(--ink-secondary); box-shadow: 3px 3px 0px 0px var(--ink-muted); }

    .graph-page { display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0; height: 100%; }
    .graph-toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 10px 16px; border-bottom: 1px solid var(--border-light); background: var(--bg); position: relative; z-index: 6; }
    .graph-search-wrap { position: relative; flex: 1 1 260px; max-width: 420px; min-width: 0; }
    .graph-search { width: 100%; background: var(--bg); color: var(--ink); border: 1px solid var(--border); padding: 7px 10px; font-size: 13px; font-family: var(--font-ui); outline: none; }
    .graph-search:focus { box-shadow: 2px 2px 0 0 var(--border); }
    .graph-search-results { position: absolute; top: calc(100% + 4px); left: 0; right: 0; background: var(--bg); border: 1px solid var(--border); box-shadow: 4px 4px 0 0 var(--border-light); z-index: 20; max-height: 320px; overflow-y: auto; }
    .gs-hit { display: flex; align-items: center; gap: 8px; width: 100%; padding: 7px 10px; border: none; border-bottom: 1px solid var(--border-light); background: none; color: var(--ink); font-family: var(--font-ui); font-size: 12px; text-align: left; cursor: pointer; }
    .gs-hit:hover, .gs-hit.active, .gs-hit:focus-visible { background: var(--bg-alt); outline: none; }
    .gs-hit .gs-name { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .gs-hit .gs-meta { color: var(--ink-faint); font-family: var(--font-mono); font-size: 10px; white-space: nowrap; }

      switch (tab) {
        case 'dashboard': renderDashboard(); break;
        case 'memories': renderMemories(); break;
        case 'lessons': renderLessons(); break;
        case 'crystals': renderCrystals(); break;
        case 'actions': renderActions(); break;
        case 'audit': renderAudit(); break;
        case 'sessions': renderSessions(); break;
        case 'health': renderHealth(); break;
        case 'profile': renderProfilePage(); break;
        case 'activity': if (state.activity.loaded) renderActivity(); break;
        case 'graph': renderGraphView(); break;
        case 'replay': if (state.replay.loaded) renderReplay(); break;
      }
      tabRendered[tab] = true;
      tabDirty[tab] = false;
    }

    function tabNeeds(tab) {
      switch (tab) {
        case 'dashboard': return ['session', 'audit', 'semantic', 'procedural'];
        case 'memories': return ['memory'];
        case 'lessons': return ['lesson', 'session'];
        case 'crystals': return ['crystal', 'lesson'];
        case 'actions': return ['action'];
        case 'audit': return ['audit', 'lesson', 'action'];
        case 'sessions': return ['session'];
        case 'profile': return ['session', 'lesson', 'memory'];
        case 'activity': return ['session'];
        case 'replay': return ['session'];
        default: return [];
      }
    }

    async function showTab(tab, opts) {
      opts = opts || {};
      var needs = tabNeeds(tab);
      var missing = needs.filter(function(kind) { return !store.loaded[kind]; });
      if (!tabRendered[tab] || tabDirty[tab] || missing.length === 0) renderTab(tab);
      if (missing.length > 0) {
        await Promise.all(missing.map(ensureLoaded));
        if (state.activeTab === tab) renderTab(tab);
      }
      if (tab === 'dashboard') ensureConsolidationStatus();
      if (tab === 'actions') ensureFrontier();
      if (tab === 'graph') {
        if (!state.graph.loaded && !state.graph.loading) await loadGraph();
        else if (state.graph.dirty) scheduleGraphReload();
        else if (state.graph.simStale) { syncGraphSim(false); requestGraphDraw(); }
      }
      if (tab === 'profile') ensureProfileData();
      if (tab === 'activity' && !state.activity.loaded) await loadActivity();
      if (tab === 'replay' && !state.replay.loaded) await loadReplay();
      if (opts.id) revealRouteEntity(tab, opts.id);
    }

    function revealRouteEntity(tab, id) {
      var sel = null;
      if (tab === 'memories') sel = '[data-memory-id="' + cssEscape(id) + '"]';
      else if (tab === 'sessions') {
        if (state.sessions.detail && state.sessions.detail.focusObs) return;
        sel = window.matchMedia('(max-width: 1100px)').matches ? '#session-detail' : '#session-list [data-session-id="' + cssEscape(id) + '"]';
      }
      else if (tab === 'lessons') sel = window.matchMedia('(max-width: 1100px)').matches ? '#lesson-detail' : '[data-lesson-id="' + cssEscape(id) + '"]';
      else if (tab === 'actions') sel = window.matchMedia('(max-width: 1100px)').matches ? '#action-detail' : '[data-action-id="' + cssEscape(id) + '"]';
      else if (tab === 'crystals') sel = '[data-crystal-id="' + cssEscape(id) + '"]';
      else if (tab === 'audit') sel = '[data-audit-row="' + cssEscape(id) + '"]';
      else if (tab === 'health') sel = '#health-' + cssEscape(id);
      if (!sel) return;
      var el = document.querySelector('#view-' + tab + ' ' + sel);
      if (el && el.scrollIntoView) el.scrollIntoView({ block: sel.charAt(0) === '#' ? 'start' : 'center' });
      if (tab === 'memories' && !el) renderMemories();
    }

    function cssEscape(s) {
      return String(s).replace(/["\\]/g, '\\$&');
    }

    function markDirty(tabs) {
      tabs.forEach(function(t) { tabDirty[t] = true; });
      if (tabs.indexOf(state.activeTab) >= 0) scheduleLiveRender();
    }

    function listOr(previous, result, key, fallbackKey) {
      if (result === null || result === undefined) return previous || [];
      return result[key] || (fallbackKey && result[fallbackKey]) || [];
    }

    function entityList(kind) {
      var bucket = store.entities[kind] || {};
      return Object.keys(bucket).map(function(k) { return bucket[k]; });
    }

    function sortByTimeDesc(list, keys) {
      function ts(item) {
        for (var i = 0; i < keys.length; i++) {
          if (item && item[keys[i]]) return String(item[keys[i]]);
        }
        return '';
      }
      return list.slice().sort(function(a, b) { return ts(b).localeCompare(ts(a)); });
    }

    function replaceBucket(kind, rows) {
      var bucket = {};
      (rows || []).forEach(function(row) {
        var id = entityKey(kind, row);
        if (id) bucket[id] = row;
      });
      store.entities[kind] = bucket;
    }

    async function ensureLoaded(kind) {
      if (store.loaded[kind]) return;
      if (store.loading[kind]) return store.loading[kind];
      var spec = ENTITY_ENDPOINTS[kind];
      if (!spec) return;
      store.loading[kind] = (async function() {
        try {
          await bootGate;
          var seqAtStart = eventSeq;
          var result = await apiGet(spec.path);
          if (result === null) return;
          replaceBucket(kind, listOr([], result, spec.key, spec.fallbackKey));
          if (kind === 'memory') {
            state.memories.nextCursor = result.nextCursor || null;
            state.memories.facets = result.facets || null;
            state.memories.fetches = {};
            if (memoryFiltersActive() || state.memories.searchIds) setTimeout(applyMemoryFilters, 0);
          }
          if (kind === 'session') {
            state.sessions.nextCursor = result.nextCursor || null;
            state.sessions.facets = result.facets || null;
          }
          if (kind === 'audit') {
            state.audit.exhausted = {};
            if ((result[spec.key] || []).length < 100) state.audit.exhausted['|||'] = true;
            seedFeedFromAudit();
          }
          replayEventsSince(seqAtStart, kind);
          store.loaded[kind] = true;
        } finally {
          store.loading[kind] = null;
        }
      })();
      return store.loading[kind];
    }

    function replayEventsSince(seq, onlyKind) {
      eventLog.forEach(function(entry) {
        if (entry.seq <= seq) return;
        if (onlyKind && entry.kind !== onlyKind) return;
        reduceLiveEvent(store, entry.type, entry.data);
      });
    }

    async function loadSnapshot(retried) {
      var resetSeq = state.graph.resetSeq;
      var snap = await apiGet('viewer/snapshot');
      if (resetSeq !== state.graph.resetSeq) return retried ? false : loadSnapshot(true);
      if (!snap) return false;
      var graphBefore = store.graph && store.graph.updatedAt;
      var reconnect = !!store.snapshotAt;
      noteGraphGeneration(snap.graph);
      applySnapshot(store, snap);
      renderFlagsChip();
      renderFlagsPanel();
      updateCountBadges();
      updateFooter();
      markDirty(['dashboard', 'health', 'graph']);
      if (reconnect && state.graph.loaded && (!store.graph || store.graph.updatedAt !== graphBefore)) scheduleGraphReload();
      if (!tabRendered[state.activeTab] || state.activeTab === 'dashboard' || state.activeTab === 'health') renderTab(state.activeTab);
      return true;
    }

    function applySnapshot(s, snap) {
      s.snapshot = snap;
      s.version = snap.version || s.version;
      s.provider = snap.provider || '';
      s.embeddingProvider = snap.embeddingProvider || '';
      s.flags = Array.isArray(snap.flags) ? snap.flags : [];
      s.graph = snap.graph || null;
      s.consolidation = snap.consolidation || null;
      if (snap.consolidation && snap.consolidation.status) s.consolidationStatus = snap.consolidation.status;
      s.report = snap.report || s.report;
      s.status = snap.status || '';
      s.health = snap.health || null;
      s.circuitBreaker = snap.circuitBreaker || null;
      s.functionMetrics = Array.isArray(snap.functionMetrics) ? snap.functionMetrics : [];
      s.counts = snap.counts || s.counts;
      s.indexes = snap.indexes || null;
      s.snapshotAt = Date.now();
      s.lastHealthAt = Date.now();
    }

    var consolidationStatusRequest = null;
    function ensureConsolidationStatus(force) {
      if (!force && (store.consolidationStatus || consolidationStatusRequest)) return;
      consolidationStatusRequest = apiGet('consolidation/status').then(function(res) {
        consolidationStatusRequest = null;
        if (res && res.tiers) {
          store.consolidationStatus = res;
          markDirty(['dashboard']);
        }
      });
    }

    var frontierRequest = null;
    var frontierStale = true;
    function ensureFrontier() {
      if (!frontierStale || frontierRequest) return;
      frontierStale = false;
      frontierRequest = apiGet('frontier').then(function(res) {
        frontierRequest = null;
        if (res) state.actions.frontier = res.frontier || res.actions || [];
        markDirty(['actions']);
      });
    }

    function estimateTokenSavings(sessions, tokenBudget) {
      var full = 0;
      var injected = 0;
      sessions.forEach(function(s) {
        var sessionFull = (s.observationCount || 0) * 80;
        if (sessionFull <= 0) return;
        full += sessionFull;
        injected += Math.min(tokenBudget, sessionFull);
      });
      var saved = Math.max(0, full - injected);
      return { percent: full > 0 ? Math.round((saved / full) * 100) : 0, saved: saved };
    }

    var LAYER_STATE_BADGES = { off: 'badge-muted', waiting: 'badge-yellow', ready: 'badge-blue', ran: 'badge-green', error: 'badge-red' };
    var LAYER_STATE_LABELS = { off: 'off', waiting: 'waiting', ready: 'ready', ran: 'active', error: 'failed' };

    function layerPreview(tierId, semFacts, procItems) {
      var items = [];
      if (tierId === 'semantic') {
        items = semFacts.slice(0, 3).map(function(f) { return f.fact || f.content || f.title || ''; });
      } else if (tierId === 'procedural') {
        items = procItems.slice(0, 3).map(function(p) {
          var steps = p.steps && p.steps.length ? ' (' + p.steps.length + ' 个步骤）' : '';
          return (p.name || p.title || '流程') + steps;
        });
      }
      items = items.filter(Boolean);
      if (!items.length) return '';
      return '<ul class="layer-preview">' + items.map(function(t) { return '<li>' + esc(truncate(t, 140)) + '</li>'; }).join('') + '</ul>';
    }

    function renderMemoryLayers(status, semFacts, procItems) {
      var html = '<div class="card" style="margin-top:0;"><div class="card-title">记忆层 ' + help('consolidation');

      status.tiers.forEach(function(t) {
        html += '<div class="layer-row">' +
          '<div class="layer-head"><span class="layer-name">' + esc(t.label) + '</span>' +

          '<span class="badge ' + (LAYER_STATE_BADGES[t.state] || 'badge-muted') + '">' + esc(LAYER_STATE_LABELS[t.state] || t.state) + '</span></div>' +
          '<div class="layer-from">' + esc(t.from) + '</div>' +
          '<div class="layer-detail">' + esc(t.detail) + '</div>' +
          layerPreview(t.id, semFacts, procItems) +
          '</div>';
      });
      html += '</div>';
      return html;
    }

    function statCard(o) {
      var attrs = o.tab ? ' data-action="goto-tab" data-tab="' + o.tab + '" role="link" tabindex="0"' : '';
      return '<div class="stat-card"' + attrs + '>' +
        '<div class="label">' + esc(o.label) + (o.help ? help(o.help) : '') + '</div>' +
        '<div class="value">' + o.value + '</div>' +
        '<div class="sub">' + (o.sub || '&nbsp;') + '</div>' +
        '</div>';
    }

    function fmtNum(n) {
      if (n === null || n === undefined || !isFinite(n)) return '-';
      return Number(n).toLocaleString();
    }

    function mb(bytes) {
      return Math.round((bytes || 0) / 1024 / 1024);
    }

    function formatUptime(seconds) {
      if (!seconds && seconds !== 0) return '-';
      var mins = Math.floor(seconds / 60);
      var hrs = Math.floor(mins / 60);
      if (hrs >= 48) return Math.floor(hrs / 24) + 'd';
      return hrs > 0 ? hrs + 'h ' + (mins % 60) + 'm' : mins + 'm';
    }

    function healthDotClass(status) {
      return status === 'healthy' ? 'healthy' : status === 'degraded' ? 'degraded' : status === 'critical' ? 'critical' : '';
    }

      var c = store.counts || {};

      var cb = store.circuitBreaker;
      var fMetrics = store.functionMetrics || [];
      var idx = store.indexes || {};
      var sessions = sortByTimeDesc(entityList('session'), ['startedAt']);
      var html = '';

      if ((c.sessions || 0) === 0 && (c.memories || 0) === 0) {

          '<div style="font-family:var(--font-ui);font-size:11px;letter-spacing:0.15em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:6px;">首次运行</div>' +
          '<div style="font-family:var(--font-display);font-size:20px;font-weight:700;color:var(--ink);margin-bottom:6px;">agentmemory 正在运行，等待第一个会话</div>' +
          '<div style="font-size:13px;color:var(--ink-muted);margin-bottom:10px;line-height:1.5;max-width:760px;">本服务器正在监听 <code>' + esc(agentUrl()) + '</code>。一旦有带 agentmemory 钩子的智能体运行，每个页面都会实时填充，无需刷新。</div>' +
          '<div class="first-run-steps">' +
          '<div><div class="empty-steps-title">1 &middot; 连接你的智能体</div><div class="empty-step-label">将钩子和 MCP 服务器接入 Claude Code（或在下拉列表中选择 codex、cursor、gemini-cli 等）' + (customPort() ? '。本服务器不在默认端口 3111 上，请在启动智能体的 shell 中导出它的 URL' : '') + '：</div>' + cmdBlock(connectCmd()) + '</div>' +
          '<div><div class="empty-steps-title">2 &middot; 开始一个会话</div><div class="empty-step-label">在项目中打开你的智能体，随便问它点什么。会话、观测和记忆会在写入时显示在这里。</div></div>' +

      if (snap.alerts && snap.alerts.length > 0) {
        html += '<div class="card" style="margin-bottom:14px;border-color:var(--accent）;border-width:2px;padding:12px 16px;"><div class="card-title" style="color:var(--accent）;border-bottom-color:var(--accent）;margin-bottom:6px;">需要关注（' + snap.alerts.length + '）</div>';
        snap.alerts.forEach(function(al) {

        });

      }

      html += '<div class="section-head"><h2>你的智能体记住了什么</h2><span class="section-sub">实时更新</span></div>';
      html += '<div class="stats-grid">';
      html += statCard({ label: '记忆', help: 'memory', tab: 'memories', value: fmtNum(c.latestMemories), sub: fmtNum(c.memories) + '（含旧版本）' });
      html += statCard({ label: '观测', help: 'observation', tab: 'sessions', value: fmtNum(c.observations), sub: '跨 ' + fmtNum(c.sessions) + ' 个会话' });
      html += statCard({ label: '会话', help: 'session', tab: 'sessions', value: fmtNum(c.sessions), sub: fmtNum(c.activeSessions) + ' 正在运行' });
      html += statCard({ label: '经验教训', help: 'lesson', tab: 'lessons', value: fmtNum(c.lessons), sub: '从以往工作中学到的规则' });
      html += statCard({ label: '结晶', help: 'crystal', tab: 'crystals', value: fmtNum(c.crystals), sub: '已完成工作的总结' });
      html += statCard({ label: '行动', help: 'action', tab: 'actions', value: fmtNum(c.actions), sub: '跟踪的后续事项' });
      html += statCard({ label: 'Graph', help: 'graph', tab: 'graph', value: fmtNum(c.graphNodes), sub: fmtNum(c.graphEdges) + ' 个关系' });
      var tokenBudget = parseInt(new URLSearchParams(window.location.search).get('tokenBudget') || '2000', 10) || 2000;
      var est = estimateTokenSavings(sessions, tokenBudget);
      html += statCard({ label: '节省的上下文', help: 'contextSaved', tab: 'sessions', value: est.percent + '%', sub: '~' + fmtNum(est.saved) + ' 个 token（估算）' });
      html += '</div>';

      html += '<div class="section-head"><h2>它健康吗</h2><span class="section-sub">' + (store.lastHealthAt ? '检查于 ' + relTime(new Date(store.lastHealthAt).toISOString()) : '') + '</span></div>';
      html += '<div class="stats-grid">';
      var verdict = store.report ? store.report.status : healthStatus;
      var verdictDot = { ok: 'healthy', info: 'healthy', warn: 'degraded', error: 'critical' }[verdict] || healthDotClass(verdict);
      html += statCard({ label: '状态', help: 'health', tab: 'health', value: '<span class="health-bar" style="margin:0;"><span class="health-dot ' + verdictDot + '"></span>' + esc(verdict) + '</span>', sub: store.report ? esc(statusSummary(store.report)) : '引擎 ' + esc(snap.connectionState || 'unknown') });
      html += statCard({ label: '搜索索引', help: 'bm25', tab: 'health', value: fmtNum(idx.bm25Documents), sub: (store.embeddingProvider && store.embeddingProvider !== 'none' ? fmtNum(idx.vectorDocuments) + ' 含向量' : '仅关键词，无嵌入') + (idx.pendingVectorBackfill ? ' · ' + fmtNum(idx.pendingVectorBackfill) + ' 个待处理' : '') });
      if (snap.memory) {

        html += statCard({ label: '内存使用', help: 'heap', tab: 'health', value: heapUsed + ' MB', sub: '共 ' + heapLimit + ' MB 堆内存 · RSS ' + mb(snap.memory.rss) + ' MB' });

      var liveMetrics = fMetrics.filter(function(m) { return !m.offWithoutLlm; });

      var cbState = cb && cb.state ? cb.state : '未使用';

      html += '</div>';

      html += '<div class="dash-cols">';
      html += '<div class="card"><div class="card-title">最近会话 ' + help('session') + '</div><div class="card-scroll">';
      if (!store.loaded.session) {
        html += skeleton(5);
      } else if (sessions.length === 0) {
        html += emptyState({
          compact: true,
          title: '尚无会话',
          what: '智能体在项目中的每次运行都会成为一个拥有自己观测的会话。',

        var rect = { x: (a.x + b.x) / 2 - tw / 2 - 3, y: (a.y + b.y) / 2 - 7, w: tw + 6, h: 13 };
        if (!free(rect)) return;
        placed.push(rect);
        ctx.fillStyle = bg;
        ctx.globalAlpha = 0.9;
        ctx.fillRect(rect.x, rect.y, rect.w, rect.h);
        ctx.globalAlpha = 1;
        ctx.fillStyle = hot ? ink : muted;
        ctx.fillText(text, rect.x + 3, rect.y + 6.5);
      });
      graphSim.labeled = labeled;
    }

    function graphDetailRelations(id) {
      var g = state.graph;
      var rows = {};
      var d = g.detail && g.detail.id === id && g.detail.data ? g.detail.data : null;
      if (d && d.relations) d.relations.forEach(function(r) { rows[r.edgeId] = r; });
      graphEdgeList().forEach(function(e) {
        if (e.sourceNodeId !== id && e.targetNodeId !== id) return;
        var out = e.sourceNodeId === id;
        var n = g.nodeMap[out ? e.targetNodeId : e.sourceNodeId];
        rows[e.id] = { edgeId: e.id, type: e.type, direction: out ? 'out' : 'in', weight: e.weight, observationCount: (e.sourceObservationIds || []).length, neighbor: n ? { id: n.id, name: n.name, type: n.type } : (rows[e.id] && rows[e.id].neighbor) || null };
      });
      return Object.keys(rows).map(function(k) { return rows[k]; }).sort(function(a, b) {
        return String(a.type).localeCompare(String(b.type)) || (a.direction === b.direction ? 0 : a.direction === 'out' ? -1 : 1) || String(a.neighbor && a.neighbor.name).localeCompare(String(b.neighbor && b.neighbor.name));
      });
    }

      graphTypeCounts().forEach(function(c) {
        var on = !g.hidden[c.type];
        html += '<li><button type="button" class="go-type' + (on ? '' : ' off') + '" data-action="graph-toggle-type" data-type="' + esc(c.type) + '" aria-pressed="' + (on ? 'true' : 'false') + '" title="' + esc(NODE_TYPE_TEXT[c.type] || c.type) + '">' + shapeSvg(c.type, 14) + '<span class="go-name">' + esc(c.type) + '</span><span class="go-num">' + fmtNum(c.total) + '</span></button><div class="go-desc">' + esc(NODE_TYPE_TEXT[c.type] || '') + '</div></li>';
      });
      html += '</ul></div>';

      var edgeTypes = graphEdgeTypeCounts();
      html += '<div class="mem-section"><div class="mem-section-title">关系类型 ' + help('graphEdge') + '</div>';
      if (!edgeTypes.length) html += '<div class="empty-step-label">还没有关系。</div>';
      else {
        html += '<ul class="go-legend go-edges">';
        edgeTypes.forEach(function(c) {
          html += '<li><span class="go-type static">' + edgeSvg(c.type) + '<span class="go-name">' + esc(String(c.type).replace(/_/g, ' ')) + '</span><span class="go-num">' + fmtNum(c.total) + '</span></span><div class="go-desc">' + esc(EDGE_TYPE_TEXT[c.type] || '') + '</div></li>';
        });
        html += '</ul>';
      }
      html += '</div>';

      var top = graphNodeList().filter(graphNodeVisible).sort(function(a, b) { return graphDegree(b.id) - graphDegree(a.id) || String(graphNodeLabel(a)).localeCompare(String(graphNodeLabel(b))); }).slice(0, 12);
      html += '<div class="mem-section"><div class="mem-section-title">连接数最多</div><ol class="go-top">';
      top.forEach(function(n) {
        html += '<li><button type="button" class="gd-neighbor" data-action="graph-select" data-node-id="' + esc(n.id) + '" aria-current="' + (n.id === g.selectedId ? 'true' : 'false') + '">' + shapeSvg(n.type, 11) + '<span>' + esc(graphNodeLabel(n, 40)) + '</span><span class="go-num">' + fmtNum(graphDegree(n.id)) + '</span></button></li>';
      });
      html += '</ol></div>';
      html += '<div class="mem-section"><div class="mem-section-title">添加到图谱</div>';
      html += '<div class="empty-step-label">导入由 graphify 生成的结构化代码图谱：</div>' + cmdBlock(curlPost('graph/import-graphify', { cwd: '/path/to/repo' }));
      html += '<div class="empty-step-label" style="margin-top:8px;">从智能体中查询：</div>' + cmdBlock('memory_graph_query { "query": "checkout" }');
      html += '</div>';
      if (g.rebuildResult) html += '<div class="mem-note">' + esc(g.rebuildResult) + '</div>';
      html += '<div class="go-live">' + (g.patches ? '已从实时流打补丁 ' + fmtNum(g.patches) + ' 次' + '' + '，最近一次 ' + relTime(new Date(g.lastPatchAt).toISOString()) + '。' : '更新通过实时流到达；不会定时刷新。') + ' ' + help('live') + '</div>';
      html += '</div>';
      setViewHtml(host, html);
    }

    function mountGraphCanvas() {
      var canvas = document.getElementById('graph-canvas');
      var stage = document.getElementById('graph-stage');
      if (!canvas || !stage) return;
      graphSim.canvas = canvas;
      graphSim.ctx = canvas.getContext('2d');
      function resize() {
        var r = stage.getBoundingClientRect();
        if (!r.width || !r.height) return;
        var dpr = window.devicePixelRatio || 1;
        var w = Math.round(r.width), h = Math.round(r.height);
        if (graphSim.w === w && graphSim.h === h && graphSim.dpr === dpr) return;
        graphSim.w = w;
        graphSim.h = h;
        graphSim.dpr = dpr;
        canvas.width = Math.round(w * dpr);
        canvas.height = Math.round(h * dpr);
        canvas.style.width = w + 'px';
        canvas.style.height = h + 'px';
        if (!graphSim.fitted) { layoutIsolated(); fitGraph(); }
        drawGraph();
      }
      if (graphSim.ro) graphSim.ro.disconnect();
      if (window.ResizeObserver) {
        graphSim.ro = new ResizeObserver(resize);
        graphSim.ro.observe(stage);
      } else {
        window.addEventListener('resize', resize);
      }
      resize();
      bindGraphPointer(canvas);
    }

    function bindGraphPointer(canvas) {
      var down = null;
      var tooltip = document.getElementById('graph-tooltip');
      function local(e) {
        var r = canvas.getBoundingClientRect();
        return { x: e.clientX - r.left, y: e.clientY - r.top };
      }
      function showTip(s, p) {
        if (!tooltip) return;
        if (!s) { tooltip.classList.remove('visible'); return; }
        var n = state.graph.nodeMap[s.id];
        if (!n) return;
        tooltip.innerHTML = '<div class="tt-name">' + esc(n.name) + '</div><div class="tt-meta">' + shapeSvg(n.type, 11) + esc(n.type) + ' · ' + fmtNum(graphDegree(n.id)) + ' 个关系' + '' + '</div><div class="tt-hint">点击查看关系与来源</div>';
        var x = Math.min(p.x + 14, graphSim.w - 240);
        var y = p.y + 14 > graphSim.h - 70 ? p.y - 70 : p.y + 14;
        tooltip.style.left = Math.max(4, x) + 'px';
        tooltip.style.top = Math.max(4, y) + 'px';
        tooltip.classList.add('visible');
      }
      canvas.addEventListener('pointerdown', function(e) {
        var p = local(e);
        graphSim.pointers[e.pointerId] = p;
        var ids = Object.keys(graphSim.pointers);
        if (ids.length === 2) {
          var a = graphSim.pointers[ids[0]], b = graphSim.pointers[ids[1]];
          down = { pinch: Math.hypot(a.x - b.x, a.y - b.y), zoom: graphSim.zoom, moved: true };
          graphSim.drag = null;
          return;
        }
        var hit = graphHit(p.x, p.y);
        down = { x: p.x, y: p.y, panX: graphSim.panX, panY: graphSim.panY, node: hit, moved: false };
        try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
      });
      canvas.addEventListener('pointermove', function(e) {
        var p = local(e);
        if (graphSim.pointers[e.pointerId]) graphSim.pointers[e.pointerId] = p;
        if (down && down.pinch) {
          var ids = Object.keys(graphSim.pointers);
          if (ids.length === 2) {
            var a = graphSim.pointers[ids[0]], b = graphSim.pointers[ids[1]];
            var dist = Math.hypot(a.x - b.x, a.y - b.y);
            zoomGraphAt((down.zoom * dist / down.pinch) / graphSim.zoom, (a.x + b.x) / 2, (a.y + b.y) / 2);
          }
          return;
        }
        if (down) {
          var dx = p.x - down.x, dy = p.y - down.y;
          if (!down.moved && dx * dx + dy * dy > 16) down.moved = true;
          if (!down.moved) return;
          if (down.node) {
            var s = down.node;
            graphSim.drag = s;
            s.x = (p.x - graphSim.panX) / graphSim.zoom;
            s.y = (p.y - graphSim.panY) / graphSim.zoom;
            if (s.isolated) s.pinned = 'user';
            reheatGraph(0.12);
          } else {
            graphSim.panX = down.panX + dx;
            graphSim.panY = down.panY + dy;
            requestGraphDraw();
          }
          showTip(null);
          return;
        }
        var hit = graphHit(p.x, p.y);
        var id = hit ? hit.id : null;
        canvas.style.cursor = hit ? 'pointer' : 'grab';
        if (id !== graphSim.hoverId) {
          graphSim.hoverId = id;
          requestGraphDraw();
        }
        showTip(hit, p);
      });
      function end(e) {
        delete graphSim.pointers[e.pointerId];
        if (!down) return;
        if (down.pinch) { if (!Object.keys(graphSim.pointers).length) down = null; return; }
        var d = down;
        down = null;
        graphSim.drag = null;
        if (d.moved) return;
        if (e.type === 'pointercancel') return;
        if (d.node) selectGraphNode(d.node.id, { focusDetail: e.pointerType !== 'mouse' });
        else if (state.graph.selectedId) selectGraphNode(null);
      }
      canvas.addEventListener('pointerup', end);
      canvas.addEventListener('pointercancel', end);
      canvas.addEventListener('pointerleave', function() {
        if (graphSim.hoverId) { graphSim.hoverId = null; requestGraphDraw(); }
        showTip(null);
      });
      canvas.addEventListener('wheel', function(e) {
        e.preventDefault();
        var p = local(e);
        zoomGraphAt(Math.exp(-e.deltaY * 0.0015), p.x, p.y);
      }, { passive: false });
      canvas.addEventListener('keydown', function(e) {
        var k = e.key;
        if (k === '+' || k === '=') zoomGraphAt(1.25);
        else if (k === '-' || k === '_') zoomGraphAt(0.8);
        else if (k === '0') fitGraph();
        else if (k === 'ArrowLeft') { graphSim.panX += 60; requestGraphDraw(); }
        else if (k === 'ArrowRight') { graphSim.panX -= 60; requestGraphDraw(); }
        else if (k === 'ArrowUp') { graphSim.panY += 60; requestGraphDraw(); }
        else if (k === 'ArrowDown') { graphSim.panY -= 60; requestGraphDraw(); }
        else if (k === 'Escape' && state.graph.selectedId) selectGraphNode(null);
        else return;
        e.preventDefault();
        e.stopPropagation();
      });
    }

    function bindGraphChrome() {
      var input = document.getElementById('graph-search');
      if (input) {
        bindImeSafeSearch(input, 120, function(v) {
          var g = state.graph;
          g.search = v;
          g.searchOpen = !!v.trim();
          g.searchIndex = 0;
          renderGraphSearchResults();
          requestGraphDraw();
        });
        input.addEventListener('focus', function() {
          if (state.graph.search.trim()) { state.graph.searchOpen = true; renderGraphSearchResults(); }
        });
        input.addEventListener('keydown', function(e) {
          var g = state.graph;
          var hits = graphSearchMatches(8);
          if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
            if (!hits.length) return;
            g.searchOpen = true;
            g.searchIndex = (g.searchIndex + (e.key === 'ArrowDown' ? 1 : hits.length - 1)) % hits.length;
            renderGraphSearchResults();
            e.preventDefault();
          } else if (e.key === 'Enter') {
            g.search = input.value;
            var list = graphSearchMatches(8);
            var pick = list[Math.min(g.searchIndex, list.length - 1)];
            if (pick) {
              g.searchOpen = false;
              renderGraphSearchResults();
              selectGraphNode(pick.id, { center: true });
            } else if (g.truncated && input.value.trim()) {
              searchGraphRemote(input.value.trim());
            }
            e.preventDefault();
          } else if (e.key === 'Escape') {
            if (g.searchOpen) { g.searchOpen = false; renderGraphSearchResults(); }
            else if (input.value) { input.value = ''; g.search = ''; requestGraphDraw(); }
            e.preventDefault();
            e.stopPropagation();
          }
        });
        input.addEventListener('blur', function() {
          setTimeout(function() {
            var box = document.getElementById('graph-search-results');
            if (box && box.contains(document.activeElement)) return;
            state.graph.searchOpen = false;
            renderGraphSearchResults();
          }, 150);
        });
      }
      var sel = document.getElementById('graph-type-filter');
      if (sel) {
        sel.addEventListener('change', function() {
          var g = state.graph;
          var v = sel.value;
          if (v === '__custom') return;
          g.hidden = {};
          if (v) graphTypeCounts().forEach(function(t) { if (t.type !== v) g.hidden[t.type] = true; });
          afterGraphFilter();
        });
      }
    }

    function afterGraphFilter() {
      var g = state.graph;
      if (g.selectedId && g.nodeMap[g.selectedId] && g.hidden[g.nodeMap[g.selectedId].type]) selectGraphNode(null);
      graphSim.fitted = false;
      fitGraph();
      renderGraphToolbar();
      renderGraphOverview();
    }

    async function searchGraphRemote(q) {
      var g = state.graph;
      var seq = ++g.searchRequestSeq;
      var box = document.getElementById('graph-search-results');
      if (box) { box.hidden = false; box.innerHTML = '<div class="gs-empty">正在搜索全部节点…</div>'; }
      var res = await apiPost('graph/query', { query: q, limit: 50 });
      if (seq !== g.searchRequestSeq) return;
      if (!res) {
        if (box) box.innerHTML = '<div class="gs-empty">服务器搜索失败。</div>';
        return;
      }
      mergeGraphRows(res.nodes || [], res.edges || []);
      syncGraphSim(false);
      g.search = q;
      g.searchOpen = true;
      g.searchIndex = 0;
      renderGraphView();
      var first = graphSearchMatches(1)[0];
      if (first) selectGraphNode(first.id, { center: true });
    }

    function handleGraphAction(action, target) {
      var g = state.graph;
      var id = target.getAttribute('data-node-id');
      if (action === 'graph-select' && id) {
        g.searchOpen = false;
        renderGraphSearchResults();
        selectGraphNode(id, { center: true, focusDetail: true });
        return true;
      }
      if (action === 'graph-close') {
        selectGraphNode(null);
        var canvas = document.getElementById('graph-canvas');
        if (canvas) canvas.focus({ preventScroll: true });
        return true;
      }
      if (action === 'graph-center' && id) { centerGraphOn(id); return true; }
      if (action === 'graph-refresh-detail' && id) { fetchGraphDetail(id); return true; }
      if (action === 'graph-toggle-type') {
        var type = target.getAttribute('data-type');
        if (!type) return true;
        if (g.hidden[type]) delete g.hidden[type];
        else g.hidden[type] = true;
        afterGraphFilter();
        var again = document.querySelector('#graph-overview [data-action="graph-toggle-type"][data-type="' + cssEscape(type) + '"]');
        if (again) again.focus({ preventScroll: true });
        return true;
      }
      if (action === 'graph-retry') { g.loaded = false; loadGraph(); return true; }
      if (action === 'graph-search-remote') {
        var input = document.getElementById('graph-search');
        if (input && input.value.trim()) searchGraphRemote(input.value.trim());
        return true;
      }
      return false;
    }

    window.zoomGraph = function(dir) {
      zoomGraphAt(dir > 0 ? 1.25 : 0.8);
    };
    window.recenterGraph = function() {
      fitGraph();
    };

    var graphRebuilding = false;
    async function rebuildGraph() {
      if (graphRebuilding) return;
      var ok = window.confirm(
        'Rebuild the knowledge graph from every stored observation？\n\n' +
        '这将重放整个语料库，在大型存储上可能需要几分钟。 ' +
        '开启 LLM 提取时还会消耗服务商 token。'
      );
      if (!ok) return;
      graphRebuilding = true;
      var g = state.graph;
      g.rebuildResult = '正在从已存储的观测重建…';
      renderGraphOverview();
      try {
        var result = await apiPost('graph/build', {});
        g.rebuildResult = result && result.success
          ? '已从 ' + (result.sessions || 0) + ' 个会话重建：' + (result.nodes || 0) + ' 个节点、' + (result.edges || 0) + ' 个关系已提取。新的内容将通过实时流到达。'
          : '重建失败。请检查服务器日志。';
      } finally {
        graphRebuilding = false;
        renderGraphView();
      }
    }

    function memoryRows() {
      var m = state.memories;
      var rows;
      if (m.searchIds) {
        rows = m.searchIds.map(function(id) { return store.entities.memory[id]; }).filter(Boolean);
      } else {
        rows = sortByTimeDesc(entityList('memory').filter(function(x) { return x && x.isLatest !== false; }), ['updatedAt', 'createdAt']);
      }
      return rows.filter(memoryMatchesFilters);
    }

    var MEMORY_TYPES = ['architecture', 'bug', 'fact', 'pattern', 'preference', 'workflow'];

    function memoryFiltersActive() {
      var m = state.memories;
      return !!(m.typeFilter || m.projectFilter || m.agentFilter);
    }

    function memoryMatchesFilters(mem) {
      var m = state.memories;
      if (!mem || mem.isLatest === false) return false;
      if (m.typeFilter && mem.type !== m.typeFilter) return false;
      if (m.projectFilter && mem.project !== m.projectFilter) return false;
      if (m.agentFilter && mem.agentId !== m.agentFilter) return false;
      return true;
    }

    function memoryQueryPath(extra) {
      var m = state.memories;
      var path = 'memories?latest=true&limit=100';
      if (m.projectFilter) path += '&project=' + encodeURIComponent(m.projectFilter);
      if (m.agentFilter) path += '&agentId=' + encodeURIComponent(m.agentFilter);
      if (m.typeFilter) path += '&type=' + encodeURIComponent(m.typeFilter);
      return path + (extra || '');
    }

    function mergeMemoryRows(rows) {
      (rows || []).forEach(function(r) {
        if (r && r.id) store.entities.memory[r.id] = Object.assign({}, store.entities.memory[r.id] || {}, r);
      });
    }

    function strengthScore(m) {
      var raw = Number(m.strength) || 0;
      var score = raw <= 1 ? raw * 10 : raw;
      return Math.max(0, Math.min(10, Math.round(score * 10) / 10));
    }

    function memoryParentId(m) {
      return (m && (m.parentId || (m.supersedes && m.supersedes[0]))) || '';
    }

    function memoryHeadline(mem) {
      var content = String(mem.content || '').replace(/\s+/g, ' ').trim();
      var title = String(mem.title || '').replace(/\s+/g, ' ').trim().replace(/(\.\.\.|…)$/, '').replace(/[;:,]+$/, '');
      if (title && content.indexOf(title) !== 0) {
        return { head: title, excerpt: content === title ? '' : content };
      }
      var end = -1;
      var re = /[.!?;](\s|$)/g;
      var hit;
      while ((hit = re.exec(content))) {
        if (hit.index >= 24) { end = hit.index + 1; break; }
      }
      if (end > 0 && end <= 150) {
        return { head: content.slice(0, end).replace(/[;:,]+$/, ''), excerpt: content.slice(end).trim() };
      }
      if (content.length <= 150) return { head: content, excerpt: '' };
      var cut = content.lastIndexOf(' ', 120);
      if (cut < 60) cut = 120;
      return { head: content.slice(0, cut) + '…', excerpt: '…' + content.slice(cut).trim() };
    }

    function memoryFacetList(dim) {
      var f = state.memories.facets;
      var key = dim === 'project' ? 'projects' : dim === 'agent' ? 'agents' : 'types';
      if (f && f[key]) return f[key];
      var counts = {};
      entityList('memory').forEach(function(x) {
        if (!x || x.isLatest === false) return;
        var v = dim === 'project' ? x.project : dim === 'agent' ? x.agentId : x.type;
        if (v) counts[v] = (counts[v] || 0) + 1;
      });
      return Object.keys(counts).sort(function(a, b) { return counts[b] - counts[a] || a.localeCompare(b); }).map(function(v) { return { value: v, count: counts[v] }; });
    }

    function adjustMemoryFacets(prev, next) {
      var f = state.memories.facets;
      if (!f) return;
      function bump(row, delta) {
        if (!row || row.isLatest === false) return;
        [['projects', row.project], ['agents', row.agentId], ['types', row.type]].forEach(function(pair) {
          if (!pair[1] || !f[pair[0]]) return;
          var list = f[pair[0]];
          var item = list.filter(function(x) { return x.value === pair[1]; })[0];
          if (!item) { if (delta < 0) return; item = { value: pair[1], count: 0 }; list.push(item); }
          item.count = Math.max(0, item.count + delta);
        });
      }
      bump(prev, -1);
      bump(next, 1);
    }

    function noteMemoryChange(prev, next, id) {
      var m = state.memories;
      adjustMemoryFacets(prev, next);
      if (m.query && typeof m.query.total === 'number') {
        m.query.total += (memoryMatchesFilters(next) ? 1 : 0) - (memoryMatchesFilters(prev) ? 1 : 0);
      }
      if (!next && m.checked[id]) delete m.checked[id];
      if (next && next.isLatest === false && m.checked[id]) delete m.checked[id];
      if (next && m.pendingId && next.id === m.pendingId) m.pendingId = null;
    }

    var memorySearchSeq = 0;
    async function runMemorySearch(q) {
      var query = String(q || '').trim();
      state.memories.search = q;
      var seq = ++memorySearchSeq;
      if (!query) {
        state.memories.searchIds = null;
        state.memories.searchMode = '';
        state.memories.searching = false;
        applyMemoryFilters();
        return;
      }
      state.memories.searching = true;
      renderMemories();
      var res = await apiGet(memoryQueryPath('&q=' + encodeURIComponent(query)));
      if (seq !== memorySearchSeq) return;
      state.memories.searching = false;
      if (!res) {
        state.memories.searchIds = [];
        state.memories.searchMode = 'failed';
      } else {
        var rows = res.memories || [];
        mergeMemoryRows(rows);
        state.memories.searchIds = rows.map(function(r) { return r.id; });
        state.memories.searchMode = (res.search && res.search.mode) || 'keyword';
      }
      renderMemories();
    }

    var memoryFilterSeq = 0;
    async function applyMemoryFilters() {
      var m = state.memories;
      m.checked = {};
      if (String(m.search || '').trim()) {
        runMemorySearch(m.search);
        return;
      }
      var seq = ++memoryFilterSeq;
      if (!memoryFiltersActive()) {
        m.query = null;
        renderMemories();
        return;
      }
      m.query = { loading: true, total: null, nextCursor: null };
      renderMemories();
      var res = await apiGet(memoryQueryPath());
      if (seq !== memoryFilterSeq) return;
      if (res) {
        mergeMemoryRows(res.memories);
        m.query = { loading: false, total: typeof res.total === 'number' ? res.total : null, nextCursor: res.nextCursor || null };
      } else {
        m.query = { loading: false, failed: true, total: null, nextCursor: null };
      }
      renderMemories();
    }

    function setMemoryFilter(dim, value) {
      var m = state.memories;
      if (dim === 'project') m.projectFilter = value;
      else if (dim === 'agent') m.agentFilter = value;
      else if (dim === 'type') m.typeFilter = value;
      applyMemoryFilters();
    }

    function clearMemoryFilters() {
      var m = state.memories;
      m.projectFilter = '';
      m.agentFilter = '';
      m.typeFilter = '';
      m.search = '';
      m.searchIds = null;
      m.searchMode = '';
      m.searching = false;
      memorySearchSeq++;
      var input = document.getElementById('mem-search');
      if (input) input.value = '';
      applyMemoryFilters();
    }

    async function loadMoreMemories() {
      var m = state.memories;
      var cursor = m.query ? m.query.nextCursor : m.nextCursor;
      if (!cursor || m.loadingMore) return;
      m.loadingMore = true;
      renderMemories();
      var res = await apiGet(memoryQueryPath('&cursor=' + encodeURIComponent(cursor)));
      m.loadingMore = false;
      if (res) {
        mergeMemoryRows(res.memories);
        if (m.query) m.query.nextCursor = res.nextCursor || null;
        else m.nextCursor = res.nextCursor || null;
      }
      renderMemories();
    }

    async function fetchMemoryVersion(id) {
      var m = state.memories;
      if (!id || m.fetches[id]) return;
      m.fetches[id] = 'loading';
      var res = await apiGet('memories/' + encodeURIComponent(id));
      if (res && res.memory) {
        mergeMemoryRows([res.memory]);
        m.fetches[id] = 'done';
      } else {
        m.fetches[id] = 'missing';
      }
      if (state.activeTab === 'memories') renderMemories();
    }

    function renderMemories() {
      var el = document.getElementById('view-memories');
      var m = state.memories;
      if (!el.querySelector('#memory-list')) {

    function memoryChain(mem) {
      var seen = {};
      seen[mem.id] = true;
      var older = [];
      var missing = '';
      var cur = mem;
      for (var i = 0; i < 50; i++) {
        var pid = memoryParentId(cur);
        if (!pid || seen[pid]) break;
        seen[pid] = true;
        var parent = store.entities.memory[pid];
        if (!parent) { missing = pid; break; }
        older.push(parent);
        cur = parent;
      }
      var all = entityList('memory');
      var newer = [];
      cur = mem;
      for (var j = 0; j < 50; j++) {
        var child = null;
        for (var k = 0; k < all.length; k++) {
          if (all[k] && !seen[all[k].id] && memoryParentId(all[k]) === cur.id) { child = all[k]; break; }
        }
        if (!child) break;
        seen[child.id] = true;
        newer.unshift(child);
        cur = child;
      }
      return { versions: newer.concat([mem], older), older: older, missing: missing };
    }

    function diffWordsHtml(before, after) {
      var a = String(before || '').split(/(\s+)/).filter(Boolean);
      var b = String(after || '').split(/(\s+)/).filter(Boolean);
      var n = a.length;
      var w = b.length;
      if (n * w > 4000000) return null;
      var dp = [];
      for (var i = 0; i <= n; i++) dp.push(new Uint32Array(w + 1));
      for (i = n - 1; i >= 0; i--) {
        for (var j = w - 1; j >= 0; j--) {
          dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
        }
      }
      var ops = [];
      function push(op, tok) {
        var last = ops[ops.length - 1];
        if (last && last.op === op) last.text += tok;
        else ops.push({ op: op, text: tok });
      }
      i = 0;
      j = 0;
      while (i < n && j < w) {
        if (a[i] === b[j]) { push('=', a[i]); i++; j++; }
        else if (dp[i + 1][j] >= dp[i][j + 1]) { push('-', a[i]); i++; }
        else { push('+', b[j]); j++; }
      }
      while (i < n) push('-', a[i++]);
      while (j < w) push('+', b[j++]);
      var added = 0;
      var removed = 0;
      var html = ops.map(function(o) {
        var words = o.text.trim() ? o.text.trim().split(/\s+/).length : 0;
        if (o.op === '+') { added += words; return '<ins>' + esc(o.text) + '</ins>'; }
        if (o.op === '-') { removed += words; return '<del>' + esc(o.text) + '</del>'; }
        return esc(o.text);
      }).join('');
      return { html: html, added: added, removed: removed };
    }

    function memoryDiffHtml(prev, next) {
      var diff = diffWordsHtml(prev.content, next.content);
      var html = '';
      if (prev.type !== next.type) html += '<div class="mem-diff-sum">类型已变更： <b>' + esc(prev.type) + '</b> &rarr; <b>' + esc(next.type) + '</b></div>';
      if (!diff) return html + '<div class="mem-diff">' + esc(next.content || '') + '</div><div class="mem-diff-sum">文本过长，无法逐词比较；显示新文本。</div>';
      if (!diff.added && !diff.removed) return html + '<div class="mem-diff-sum">文本没有变化。</div>';
      return html + '<div class="mem-diff">' + diff.html + '</div><div class="mem-diff-sum">+' + fmtNum(diff.added) + ' 个词' + '' + ' 已添加，−' + fmtNum(diff.removed) + ' 个词已删除</div>';
    }

    function memoryVersionsHtml(mem, chain) {
      var m = state.memories;

      var html = '<div class="mem-section"><div class="mem-section-title">版本 ' + help('version') + '</div>';

      }
      var diffable = versions.filter(function(v, idx) { return idx < versions.length - 1 && memoryParentId(v) === versions[idx + 1].id; });
      var diffId = m.diffId && diffable.some(function(v) { return v.id === m.diffId; }) ? m.diffId : (diffable.some(function(v) { return v.id === mem.id; }) ? mem.id : (diffable[0] && diffable[0].id));
      html += '<ul class="ver-list">';

        html += '<li class="ver-item' + (v.id === mem.id ? ' current' : '') + '"><span class="ver-badge">v' + (v.version || 1) + '</span>';

        html += '</span></li>';
      });

      }
      return html + '</div>';
    }

    var modalReturnFocus = null;
    function openModal(html, focusSelector) {
      var modal = document.getElementById('modal');
      var overlay = document.getElementById('modal-overlay');

      modal.innerHTML = html;

        modal.setAttribute('aria-labelledby', 'modal-title');

    function modalFocusables() {
      var modal = document.getElementById('modal');
      return Array.prototype.slice.call(modal.querySelectorAll('a[href], button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), summary, [tabindex]:not([tabindex="-1"])')).filter(function(el) { return el.offsetParent !== null; });
    }

    document.addEventListener('keydown', function(e) {
      if (e.key !== 'Tab' || !document.getElementById('modal-overlay').classList.contains('open')) return;
      var items = modalFocusables();
      if (!items.length) { e.preventDefault(); return; }
      var first = items[0];
      var last = items[items.length - 1];
      var inside = document.getElementById('modal').contains(document.activeElement);
      if (e.shiftKey && (document.activeElement === first || !inside)) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && (document.activeElement === last || !inside)) { e.preventDefault(); first.focus(); }
    });

    function startMemoryEdit(id) {
      var mem = store.entities.memory[id];
      if (!mem) return;
      var m = state.memories;
      m.error = '';
      m.editing = { id: id, content: mem.content || '', type: mem.type || 'fact', rev: (m.editing ? m.editing.rev : 0) + 1 };
      renderMemories();
      var ta = document.getElementById('mem-edit-text');
      if (ta) ta.focus();
    }

    function reviewMemoryEdit() {
      var m = state.memories;
      var e = m.editing;
      var mem = e && store.entities.memory[e.id];
      if (!mem) return;
      var ta = document.getElementById('mem-edit-text');
      var typeSel = document.getElementById('mem-edit-type');
      if (ta) e.content = ta.value;
      if (typeSel) e.type = typeSel.value;
      if (!e.content.trim()) {
        m.error = '记忆文本不能为空。如需删除记忆，请使用“忘记”功能。';
        e.rev++;
        renderMemories();
        return;
      }
      if (e.content === mem.content && e.type === mem.type) {
        m.error = '尚未做任何更改。请编辑文本或类型，或按“取消”。';
        e.rev++;
        renderMemories();
        return;
      }
      var version = mem.version || 1;
      openModal('<h3>保存为版本 ' + (version + 1) + '?</h3>' +
        '<p>agentmemory 会将 v' + version + ' 保留为历史记录并移出搜索。智能体从此将回忆 v' + (version + 1) + '。这等同于调用 <code>POST /agentmemory/evolve</code>。</p>' +
        memoryDiffHtml(mem, { content: e.content, type: e.type }) +
        '<div class="modal-actions" style="margin-top:14px;"><button class="btn" data-action="close-modal">取消</button><button class="btn btn-primary" data-action="mem-confirm-edit">保存 v' + (version + 1) + '</button></div>', '[data-action="mem-confirm-edit"]');
    }

    async function saveMemoryEdit() {
      closeModal();
      var m = state.memories;
      var e = m.editing;
      if (!e || m.saving) return;
      var mem = store.entities.memory[e.id];
      var body = { memoryId: e.id, newContent: e.content };
      if (mem && e.type !== mem.type) body.newType = e.type;
      m.saving = true;
      m.error = '';
      e.rev++;
      renderMemories();
      var res = await api('evolve', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), readErrorBody: true });
      m.saving = false;
      if (res && res.success && res.memory && res.memory.id) {
        m.editing = null;
        m.selectedId = res.memory.id;
        m.diffId = res.memory.id;
        m.pendingId = store.entities.memory[res.memory.id] ? null : res.memory.id;
        setRouteEntity('memories', res.memory.id);
      } else {
        m.error = res && res.code === 'not_latest'
          ? '有人在您编辑期间保存了更新的版本。您的文本仍保留；请打开最新版本进行编辑。'
          : '保存失败' + (res && res.error ? ': ' + res.error : '。请确认 agentmemory 正在运行。');
        if (m.editing) m.editing.rev++;
      }
      renderMemories();
    }

      openModal('<h3>永久忘记这条记忆？</h3>' +

        (older.length ? '<label class="modal-check"><input type="checkbox" id="mem-forget-history" checked> 同时删除其 ' + older.length + ' 个旧版本' + '' + '。否则它们将作为隐藏历史保留。</label>' : '') +
        '<p style="font-size:11px;">从智能体执行：<code>memory_governance_delete { "memoryIds": "' + esc(mem.id) + '" }</code></p>' +

    async function forgetMemories(ids, reason) {
      if (!ids.length) return;
      var res = await apiDelete('governance/memories', { memoryIds: ids, reason: reason });
      var m = state.memories;
      if (res && res.success !== false) {
        ids.forEach(function(id) { delete m.checked[id]; });
        if (m.selectedId && ids.indexOf(m.selectedId) >= 0) {
          m.selectedId = null;
          m.editing = null;
          setRouteEntity('memories', '');
        }
        m.error = '';
      } else {
        m.error = '忘记失败。请确认 agentmemory 正在运行，然后重试。';
      }
      renderMemories();
    }

      var rows = Object.keys(state.memories.checked).map(function(id) { return store.entities.memory[id]; }).filter(Boolean);
      if (!rows.length) return;
      var payload = JSON.stringify({ exportedAt: new Date().toISOString(), source: apiBase(), count: rows.length, memories: rows }, null, 2);
      var url = URL.createObjectURL(new Blob([payload], { type: 'application/json' }));
      var a = document.createElement('a');
      a.href = url;
      a.download = 'agentmemory-memories-' + new Date().toISOString().slice(0, 10) + '.json';
      document.body.appendChild(a);
      a.click();
      setTimeout(function() { URL.revokeObjectURL(url); a.remove(); }, 0);

    function handleMemoryAction(action, target) {
      var m = state.memories;
      var id = target.getAttribute('data-memory-id') || '';
      if (action === 'mem-check') {
        if (target.checked) m.checked[id] = true;
        else delete m.checked[id];
        renderMemories();
      } else if (action === 'mem-check-all') {
        var rows = memoryRows();
        if (target.checked) rows.forEach(function(r) { m.checked[r.id] = true; });
        else rows.forEach(function(r) { delete m.checked[r.id]; });
        renderMemories();
      } else if (action === 'mem-uncheck-all') {
        m.checked = {};
        renderMemories();
      } else if (action === 'mem-export') {
        exportCheckedMemories();
      } else if (action === 'mem-bulk-forget') {
        openBulkForgetModal();
      } else if (action === 'mem-confirm-bulk-forget') {
        closeModal();
        forgetMemories(Object.keys(m.checked), '在查看器中批量忘记');
      } else if (action === 'mem-filter') {
        var dim = target.getAttribute('data-dim');
        var value = target.getAttribute('data-value') || '';
        var current = dim === 'project' ? m.projectFilter : dim === 'agent' ? m.agentFilter : m.typeFilter;
        setMemoryFilter(dim, current === value ? '' : value);
      } else if (action === 'mem-clear-filters') {
        clearMemoryFilters();
      } else if (action === 'mem-close') {
        m.selectedId = null;
        m.editing = null;
        m.error = '';
        setRouteEntity('memories', '');
        renderMemories();
      } else if (action === 'mem-diff') {
        m.diffId = id;
        renderMemories();
      } else if (action === 'mem-edit') {
        startMemoryEdit(id);
      } else if (action === 'mem-cancel-edit') {
        m.editing = null;
        m.error = '';
        renderMemories();
      } else if (action === 'mem-save-edit') {
        reviewMemoryEdit();
      } else if (action === 'mem-confirm-edit') {
        saveMemoryEdit();
      } else if (action === 'mem-forget') {
        openForgetModal(id);
      } else if (action === 'mem-confirm-forget') {
        var mem = store.entities.memory[id];
        var withHistory = document.getElementById('mem-forget-history');

    var ACTIVITY_SESSIONS = 10;

    async function loadActivity() {
      var sessions = sortByTimeDesc(entityList('session'), ['startedAt']).filter(function(x) { return sessionId(x); }).slice(0, ACTIVITY_SESSIONS);
      var results = await Promise.all(sessions.map(function(x) {
        return apiGet('observations?sessionId=' + encodeURIComponent(sessionId(x)) + '&limit=100');
      }));
      var seen = {};
      var allObs = [];
      results.forEach(function(r) {
        ((r && r.observations) || []).forEach(function(o) {
          if (o && o.id && !seen[o.id]) { seen[o.id] = true; allObs.push(o); }
        });
      });

      state.activity.sessionCount = sessions.length;
      state.activity.loaded = true;
