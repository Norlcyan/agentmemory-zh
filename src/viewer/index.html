    var FILE_BASENAMES = { Makefile: 1, Dockerfile: 1, Containerfile: 1, Procfile: 1, Gemfile: 1, Rakefile: 1, Jenkinsfile: 1, Vagrantfile: 1, Justfile: 1, LICENSE: 1, README: 1 };

    function looksLikeFile(f, cwd) {
      var s = String(f || '').trim();
      if (!s || /[*?{}[\]]/.test(s)) return false;
      var bare = s.replace(/[\/\\]+$/, '');
      if (cwd && bare === String(cwd).replace(/[\/\\]+$/, '')) return false;
      var base = bare.split(/[\/\\]/).pop() || '';
      return !!FILE_BASENAMES[base] || /\.[A-Za-z0-9_-]{1,12}$/.test(base);
    }

    function obsFiles(o) {
      var out = {};
      var cwd = (store.entities.session[o.sessionId] || {}).cwd;
      (o.files || []).forEach(function(f) { if (looksLikeFile(f, cwd)) out[f] = true; });
      var ti = o.toolInput;
      if (ti && typeof ti === 'object') {
        [ti.file_path, ti.notebook_path].forEach(function(f) { if (typeof f === 'string' && looksLikeFile(f, cwd)) out[f] = true; });
      }
      return Object.keys(out);
    }

    function dayKey(ts) {
      var d = new Date(ts);
      if (!isFinite(d.getTime())) return '';
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }

    function activityDays(sessions) {
      var days = {};
      sessions.forEach(function(s) {
        var k = dayKey(s.startedAt);
        if (!k) return;
        var d = days[k] || (days[k] = { sessions: [], obs: 0 });
        d.sessions.push(s);
        d.obs += s.observationCount || 0;
      });
      return days;
    }

    function heatmapHtml(sessions) {
      var act = state.activity;
      var days = activityDays(sessions);
      var keys = Object.keys(days).sort();
      var today = new Date();
      today.setHours(0, 0, 0, 0);
      var earliest = keys.length ? new Date(keys[0] + 'T00:00:00') : today;
      var spanWeeks = Math.ceil((today - earliest) / (7 * 86400000)) + 1;
      var weeks = Math.min(53, Math.max(16, spanWeeks));
      var start = new Date(today);
      start.setDate(start.getDate() - today.getDay() - (weeks - 1) * 7);
      var max = 0;
      keys.forEach(function(k) { if (days[k].obs > max) max = days[k].obs; });
      var totalObs = 0;
      var busiest = '';
      keys.forEach(function(k) { totalObs += days[k].obs; if (!busiest || days[k].obs > days[busiest].obs) busiest = k; });
      var html = '<div class="hm-stats">';
      html += '<div><b>' + fmtNum(keys.length) + '</b> 个活跃日' + '' + '</div>';
      html += '<div><b>' + fmtNum(sessions.length) + '</b> 个会话 ' + help('session') + '</div>';
      html += '<div><b>' + fmtNum(totalObs) + '</b> 个观测 ' + help('observation') + '</div>';
      html += '<div><b>' + (busiest ? esc(new Date(busiest + 'T00:00:00').toLocaleDateString(undefined, { month: 'short', day: 'numeric' })) : '-') + '</b>最活跃的一天' + (busiest ? ' · ' + fmtNum(days[busiest].obs) + ' 条观测' : '') + '</div>';
      html += '</div>';
      var labels = [];
      var cells = '';
      for (var w = 0; w < weeks; w++) {
        var weekStart = new Date(start);
        weekStart.setDate(start.getDate() + w * 7);
        labels[w] = w === 0 ? weekStart.toLocaleDateString(undefined, { month: 'short' }) : '';
        for (var i = 0; i < 7; i++) {
          var probe = new Date(weekStart);
          probe.setDate(weekStart.getDate() + i);
          if (probe.getDate() === 1) labels[w] = probe.toLocaleDateString(undefined, { month: 'short' });
        }
        for (var d = 0; d < 7; d++) {
          var day = new Date(weekStart);
          day.setDate(weekStart.getDate() + d);
          var k = dayKey(day);
          if (day > today) { cells += '<span class="hm-cell future" aria-hidden="true"></span>'; continue; }
          var info = days[k];
          var niceDate = day.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
          if (!info) { cells += '<span class="hm-cell" title="' + esc(niceDate) + '：无记录"></span>'; continue; }
          var ratio = max ? info.obs / max : 0;
          var level = ratio > 0.75 ? 4 : ratio > 0.5 ? 3 : ratio > 0.25 ? 2 : 1;
          var text = niceDate + ': ' + info.sessions.length + ' 个会话' + '' + ', ' + info.obs + ' 条观测' + '';
          cells += '<button type="button" class="hm-cell level-' + level + (act.day === k ? ' on' : '') + '" data-action="activity-day" data-day="' + k + '" title="' + esc(text) + '" aria-label="' + esc(text) + '" aria-pressed="' + (act.day === k ? 'true' : 'false') + '"></button>';
        }
      }
      if (labels[1] || labels[2]) labels[0] = '';
      html += '<div class="hm"><span></span><div class="hm-months" aria-hidden="true">' + labels.map(function(l) { return '<span>' + esc(l) + '</span>'; }).join('') + '</div>';
      html += '<div class="hm-days" aria-hidden="true"><span></span><span>一</span><span></span><span>三</span><span></span><span>五</span><span></span></div>';
      html += '<div class="hm-grid" role="group" aria-label="每天的会话与观测数">' + cells + '</div></div>';
      var c = store.counts || {};
      var total = typeof c.sessions === 'number' ? c.sessions : sessions.length;
      var cursor = state.sessions.nextCursor;
      html += '<div class="hm-foot"><span>统计此查看器中加载的 ' + fmtNum(sessions.length) + (total > sessions.length ? '/' + fmtNum(total) : '') + ' 个会话（按各自开始的日期统计）。点击有底色的日期可列出当天的会话。</span>';
      if (cursor) html += '<button class="btn" data-action="sessions-load-more"' + (state.sessions.loadingMore ? ' disabled' : '') + '>' + (state.sessions.loadingMore ? '加载中…' : '加载更早的会话') + '</button>';
      html += '<span class="hm-legend" aria-hidden="true">少 <span class="hm-cell"></span><span class="hm-cell level-1"></span><span class="hm-cell level-2"></span><span class="hm-cell level-3"></span><span class="hm-cell level-4"></span> 多</span></div>';
      if (act.day && days[act.day]) {
        var list = sortByTimeDesc(days[act.day].sessions, ['startedAt']);
        html += '<div class="day-panel"><div class="mem-section-title">' + esc(new Date(act.day + 'T00:00:00').toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' })) + ' · ' + list.length + ' 个会话' + '' + ' <button type="button" class="linkish" data-action="activity-day" data-day="' + act.day + '" style="margin-left:auto;font-size:11px;">关闭</button></div><ul class="ses-links">';
        list.slice(0, 20).forEach(function(s) {
          html += '<li><span class="badge ' + (s.status === 'active' ? 'badge-green' : 'badge-blue') + '">' + esc(s.status || 'unknown') + '</span>' + entityLink('session', sessionId(s), sessionDisplayName(s)) + '<span class="rel-time">' + esc(absTime(s.startedAt)) + ' · ' + fmtNum(s.observationCount || 0) + ' 条观测</span><span class="src-text">' + esc(s.firstPrompt || '') + '</span></li>';
        });
        html += '</ul></div>';
      }
      return html;
    }

    function activityFeedHtml(obs) {
      var act = state.activity;
      var list = obs.filter(function(o) {
        if (act.typeFilter && obsType(o) !== act.typeFilter) return false;
        if (act.fileFilter && obsFiles(o).indexOf(act.fileFilter) < 0) return false;
        return true;
      }).sort(function(a, b) { return String(b.timestamp || '').localeCompare(String(a.timestamp || '')); });
      var html = '';
      if (act.typeFilter || act.fileFilter) {
        html += '<div class="act-filter"><span>' + fmtNum(list.length) + ' 条观测' + '' + (act.typeFilter ? '（类型 <b>' + esc(act.typeFilter.replace(/_/g, ' ')) + '</b>）' : '') + (act.fileFilter ? '）（涉及 <b>' + esc(act.fileFilter.split('/').pop()) + '</b>）' : '') + '</span><button type="button" class="btn" data-action="activity-clear">显示全部</button></div>';
      }
      if (!list.length) {
        return html + emptyState({
          compact: true,
          icon: '&#128337;',
          title: act.typeFilter || act.fileFilter ? '没有匹配的观测' : '尚未捕获任何内容',
          what: '以下为最新的 ' + ACTIVITY_SESSIONS + ' 个最新会话的最新观测，按会话分组。智能体记录新观测后会立即显示在顶部。',
          why: act.typeFilter || act.fileFilter ? '已加载的观测中没有匹配所选类型或文件的。' : '最新会话尚无已捕获的工具调用。',
          steps: act.typeFilter || act.fileFilter ? [{ label: '请点击上方的“显示全部”。' }] : [{ label: '手动记录一条以观察其到达：', cmd: curlPost('observe', { hookType: 'post_tool_use', sessionId: 'demo-1', project: 'my-project', cwd: '/path/to/project', timestamp: new Date().toISOString(), data: { tool_name: 'Read', tool_input: { file_path: 'README.md' } } }) }]
        });
      }
      html += '<ol class="obs-timeline">';
      var last = null;
      list.slice(0, 40).forEach(function(o) {

          last = o.sessionId;
          html += '<li class="feed-session" aria-hidden="false">' + entityLink('session', o.sessionId, sessionDisplayName(s)) + (s.agentId ? '<span>@' + esc(s.agentId) + '</span>' : '') + (s.firstPrompt ? '<span class="src-text" title="' + esc(s.firstPrompt) + '">' + esc(truncate(s.firstPrompt, 90)) + '</span>' : '') + '</li>';
        }
        html += obsItemHtml(o, s.cwd, o.sessionId);
      });
      html += '</ol>';
      if (list.length > 40) html += '<div class="load-more">当前显示最新的 40 条，共 ' + fmtNum(list.length) + ' 条。打开会话查看完整时间线。</div>';
      return html;
    }

    function renderActivity() {
      var el = document.getElementById('view-activity');
      var act = state.activity;
      if (!store.loaded.session || !act.loaded) {
        setViewHtml(el, skeleton(10));
        return;
      }
      var sessions = entityList('session').filter(function(s) { return sessionId(s); });
      if (!sessions.length) {
        setViewHtml(el, emptyState({
          icon: '&#128200;',
          title: '暂无动态',
          what: '本页展示智能体的工作时间、所做工作的类型以及触及的文件，并实时推送最新观测的动态。',
          why: '此安装中尚未记录任何会话。',
          steps: [
            { label: '用钩子接入你的智能体以捕获其工作（可换成 codex、cursor、gemini-cli 或其他受支持的智能体）：', cmd: connectCmd() },
            { label: '或手动记录一个会话：', cmd: curlPost('session/start', { sessionId: 'demo-1', project: 'my-project', cwd: '/path/to/project' }) }
          ],
          link: { href: 'https://github.com/rohitg00/agentmemory#quick-start', text: '受支持的智能体' }
        }));

      }
      var obs = act.observations || [];
      var html = '<div class="inline-note"><strong>动态</strong>展示智能体的工作时间和工作内容。选择日期、工作类型或文件可缩小动态范围；每个条目都链接到其所属的会话和观测。动态实时更新。</div>';
      html += '<div class="card"><div class="card-title">智能体工作时间 ' + help('heatmap') + '</div>' + heatmapHtml(sessions) + '</div>';

      var typeCounts = {};
      var fileCounts = {};
      obs.forEach(function(o) {
        var t = obsType(o);
        typeCounts[t] = (typeCounts[t] || 0) + 1;
        obsFiles(o).forEach(function(f) { fileCounts[f] = (fileCounts[f] || 0) + 1; });
      });
      var typeList = Object.keys(typeCounts).sort(function(a, b) { return typeCounts[b] - typeCounts[a]; });
      var topFiles = Object.keys(fileCounts).sort(function(a, b) { return fileCounts[b] - fileCounts[a] || a.localeCompare(b); }).slice(0, 8);
      var busiest = sortByTimeDesc(sessions, ['startedAt']).slice(0, 60).sort(function(a, b) { return (b.observationCount || 0) - (a.observationCount || 0); }).slice(0, 5);

      html += '<div class="dash-cols">';
      html += '<div class="card"><div class="card-title">智能体做了什么 <span class="section-sub" style="text-transform:none;letter-spacing:0;font-family:var(--font-ui);font-weight:400;font-size:11px;color:var(--ink-faint);">' + fmtNum(obs.length) + ' 条观测，来自最近 ' + fmtNum(act.sessionCount || 0) + ' 个会话</span></div>';
      if (!typeList.length) {
        html += '<p class="empty-step-label">最新会话中尚未捕获到工具使用。当智能体读取、编辑、运行和搜索时，工作类型会显示在这里。</p>';
      } else {
        html += '<div class="mem-section-title" style="margin-top:0;">工作类型 ' + help('observation') + '</div><div class="bar-chart">';
        var maxT = typeCounts[typeList[0]] || 1;
        typeList.slice(0, 8).forEach(function(t) {
          var on = act.typeFilter === t;
          html += '<button type="button" class="bar-row linkrow' + (on ? ' on' : '') + '" data-action="activity-type" data-type="' + esc(t) + '" aria-pressed="' + (on ? 'true' : 'false') + '" title="仅显示 ' + esc(t.replace(/_/g, ' ')) + ' 观测"><span class="bar-label">' + esc(t.replace(/_/g, ' ')) + '</span><span class="bar-track"><span class="bar-fill" style="display:block;width:' + Math.round((typeCounts[t] / maxT) * 100) + '%;background:' + (OBS_TYPE_COLORS[t] || '#666666') + ';"></span></span><span class="bar-value">' + typeCounts[t] + '</span></button>';
        });
        html += '</div>';
      }
      html += '<div class="mem-section-title" style="margin-top:14px;">最常触及的文件</div>';
      if (!topFiles.length) {
        html += '<p class="empty-step-label">最新会话中尚无文件读取或编辑。</p>';
      } else {
        html += '<div class="bar-chart">';
        var maxF = fileCounts[topFiles[0]] || 1;
        topFiles.forEach(function(f) {
          var on = act.fileFilter === f;
          html += '<button type="button" class="bar-row linkrow' + (on ? ' on' : '') + '" data-action="activity-file" data-file="' + esc(f) + '" aria-pressed="' + (on ? 'true' : 'false') + '" title="' + esc(f) + '：仅显示触及该文件的观测"><span class="bar-label">' + esc(f.split('/').pop()) + '</span><span class="bar-track"><span class="bar-fill" style="display:block;width:' + Math.round((fileCounts[f] / maxF) * 100) + '%;background:var(--green);"></span></span><span class="bar-value">' + fileCounts[f] + '</span></button>';
        });
        html += '</div>';
      }
      html += '<div class="mem-section-title" style="margin-top:14px;">近期最活跃的会话</div><ul class="ses-links">';
      busiest.forEach(function(s) {
        html += '<li><span class="strength-num" style="min-width:48px;">' + fmtNum(s.observationCount || 0) + ' 条观测</span>' + entityLink('session', sessionId(s), sessionDisplayName(s)) + '<span class="src-text" title="' + esc(s.firstPrompt || '') + '">' + esc(s.firstPrompt || '') + '</span></li>';
      });
      html += '</ul></div>';

      html += '<div class="card"><div class="card-title">最新观测 ' + help('observation') + ' <span class="ses-live-note" style="font-family:var(--font-ui);font-size:11px;color:var(--ink-faint);">实时更新</span></div><div class="card-scroll" style="max-height:640px;padding-left:14px;">';
      html += activityFeedHtml(obs);
      html += '</div></div></div>';
      setViewHtml(el, html);
    }

    function handleActivityAction(action, target) {
      var act = state.activity;
      if (action === 'activity-type') { var t = target.getAttribute('data-type') || ''; act.typeFilter = act.typeFilter === t ? '' : t; }
      else if (action === 'activity-file') { var f = target.getAttribute('data-file') || ''; act.fileFilter = act.fileFilter === f ? '' : f; }
      else if (action === 'activity-day') { var d = target.getAttribute('data-day') || ''; act.day = act.day === d ? '' : d; }
      else if (action === 'activity-clear') { act.typeFilter = ''; act.fileFilter = ''; }
      renderActivity();
    }

    var TOOL_TYPE_MAP = { Read: 'file_read', Write: 'file_write', Edit: 'file_edit', MultiEdit: 'file_edit', NotebookEdit: 'file_edit', Bash: 'command_run', Grep: 'search', Glob: 'search', WebFetch: 'web_fetch', WebSearch: 'web_fetch', AskUserQuestion: 'conversation', Task: 'subagent' };
    var SESSION_OBS_PAGE = 50;

    function obsType(o) {
      if (o.type) return o.type;
      if (o.toolName && TOOL_TYPE_MAP[o.toolName]) return TOOL_TYPE_MAP[o.toolName];
      if (o.hookType === 'prompt_submit') return 'conversation';
      if (o.hookType === 'post_tool_failure') return 'error';
      return 'other';
    }

    function formatDuration(ms) {
      if (!(ms >= 0)) return '';
      var sec = Math.round(ms / 1000);
      if (sec < 60) return sec + 's';
      var min = Math.round(sec / 60);
      if (min < 60) return min + 'm';
      var h = Math.floor(min / 60);
      if (h < 48) return h + 'h ' + (min % 60) + 'm';
      return Math.round(h / 24) + 'd';
    }

    function sessionDuration(s) {
      var start = new Date(s.startedAt).getTime();
      if (!isFinite(start)) return { label: '-', title: '未记录开始时间' };
      if (s.status === 'active' || !s.endedAt) {
        var last = new Date(s.updatedAt || s.startedAt).getTime();
        var span = isFinite(last) && last - start >= 1000 ? formatDuration(last - start) : '';
        return { label: '运行中', running: true, span: span, title: span ? '仍在运行。上一条观测在开始后 ' + span + ' 到达。' : '仍在运行。' };
      }
      var end = new Date(s.endedAt).getTime();
      return { label: formatDuration(end - start) || '-', title: '从 ' + formatTime(s.startedAt) + ' 至 ' + formatTime(s.endedAt) };
    }

    function absTime(ts) {
      if (!ts) return '';
      try { return new Date(ts).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }); } catch (_) { return ''; }
    }

    function sessionFiltersActive() {
      var f = state.sessions.filters;
      return !!(String(f.q || '').trim() || f.project || f.agent || f.status);
    }

    function sessionMatches(s) {
      var f = state.sessions.filters;
      if (f.project && s.project !== f.project) return false;
      if (f.agent && s.agentId !== f.agent) return false;
      if (f.status && s.status !== f.status) return false;
      var q = String(f.q || '').trim().toLowerCase();
      if (q) {
        var hay = [sessionId(s), s.project, s.cwd, s.firstPrompt, s.agentId].map(function(v) { return String(v || '').toLowerCase(); }).join('\n');
        if (hay.indexOf(q) < 0) return false;
      }
      return true;
    }

    function sessionRows() {
      return sortByTimeDesc(entityList('session').filter(function(s) { return sessionId(s) && sessionMatches(s); }), ['startedAt']);
    }

    function sessionQueryPath(extra) {
      var f = state.sessions.filters;
      var p = 'sessions?limit=50';
      if (f.project) p += '&project=' + encodeURIComponent(f.project);
      if (f.agent) p += '&agentId=' + encodeURIComponent(f.agent);
      if (f.status) p += '&status=' + encodeURIComponent(f.status);
      if (String(f.q || '').trim()) p += '&q=' + encodeURIComponent(String(f.q).trim());
      return p + (extra || '');
    }

    function mergeSessionRows(rows) {
      (rows || []).forEach(function(row) {
        var id = sessionKey(row);
        if (id) store.entities.session[id] = Object.assign({}, store.entities.session[id] || {}, row);
      });
    }

    async function applySessionFilters() {
      var s = state.sessions;
      if (!sessionFiltersActive()) {
        s.query = null;
        renderSessions();
        return;
      }
      var path = sessionQueryPath();
      s.query = { path: path, loading: true, failed: false, nextCursor: null };
      renderSessions();
      var res = await apiGet(path);
      if (!s.query || s.query.path !== path) return;
      s.query.loading = false;
      if (!res) {
        s.query.failed = true;
      } else {
        mergeSessionRows(res.sessions);
        s.query.nextCursor = res.nextCursor || null;
      }
      renderSessions();
    }

    var applySessionFiltersSoon = debounce(applySessionFilters, 300);

    function setSessionFilter(dim, value) {
      state.sessions.filters[dim] = value || '';
      if (state.sessions.selectedId && window.matchMedia('(max-width: 1100px)').matches) {
        state.sessions.selectedId = null;
        setRouteEntity('sessions', '');
      }
      if (state.sessions.autoSelected) {
        state.sessions.selectedId = null;
        state.sessions.autoSelected = false;
      }
      if (dim === 'q') applySessionFiltersSoon();
      else applySessionFilters();
    }

    function clearSessionFilters() {
      state.sessions.filters = { q: '', project: '', agent: '', status: '' };
      state.sessions.query = null;
      renderSessions();
    }

    async function loadMoreSessions() {
      var s = state.sessions;
      var q = s.query;
      var cursor = q ? q.nextCursor : s.nextCursor;
      if (!cursor || s.loadingMore) return;
      s.loadingMore = true;
      renderTab(state.activeTab);
      var res = await apiGet(q ? q.path + '&cursor=' + encodeURIComponent(cursor) : 'sessions?limit=100&cursor=' + encodeURIComponent(cursor));
      s.loadingMore = false;
      if (res) {
        mergeSessionRows(res.sessions);
        if (q && s.query === q) q.nextCursor = res.nextCursor || null;
        else if (!q) s.nextCursor = res.nextCursor || null;
      }
      markDirty(['sessions', 'activity', 'profile', 'replay']);
      renderTab(state.activeTab);
    }

    function adjustSessionFacets(prev, next) {
      var f = state.sessions.facets;
      if (!f) return;
      function bump(list, value, delta) {
        if (!value) return;
        var row = list.find(function(x) { return x.value === value; });
        if (row) row.count = Math.max(0, row.count + delta);
        else if (delta > 0) list.push({ value: value, count: delta });
      }
      [['projects', 'project'], ['agents', 'agentId'], ['statuses', 'status']].forEach(function(pair) {
        var list = f[pair[0]] || (f[pair[0]] = []);
        var a = prev ? prev[pair[1]] : '';
        var b = next ? next[pair[1]] : '';
        if (a === b) return;
        bump(list, a, -1);
        bump(list, b, 1);
      });
    }

    function sessionFilterSelect(dim, facetKey, allLabel, current, labelFn) {
      var list = ((state.sessions.facets || {})[facetKey] || []).filter(function(x) { return x.count > 0 || x.value === current; }).slice();
      if (dim === 'status') {
        ['active', 'completed'].forEach(function(v) { if (!list.some(function(x) { return x.value === v; })) list.push({ value: v, count: 0 }); });
      }
      if (current && !list.some(function(x) { return x.value === current; })) list.unshift({ value: current, count: 0 });
      var none = list.length === 0;
      var html = '<select id="ses-' + dim + '-filter" data-dim="' + dim + '" aria-label="按' + dim + '筛选会话"' + (none ? ' disabled title="没有会话具有 ' + (dim === 'agent' ? 'agent id' : dim) + '"' : '') + '>';
      html += '<option value="">' + esc(none ? '没有 ' + dim : allLabel) + '</option>';
      list.forEach(function(x) {
        html += '<option value="' + esc(x.value) + '"' + (current === x.value ? ' selected' : '') + '>' + esc(labelFn ? labelFn(x.value) : x.value) + ' (' + fmtNum(x.count) + ')</option>';
      });
      return html + '</select>';
    }

    function sessionToolbarHtml() {
      var f = state.sessions.filters;
      var html = '<div class="toolbar mem-filters">';
      html += '<input type="search" id="ses-search" placeholder="搜索提示词、项目、ID 或智能体（按 /）" value="' + esc(f.q) + '" aria-label="搜索会话">';
      html += sessionFilterSelect('project', 'projects', '所有项目', f.project, function(v) { return String(v).split('/').pop(); });
      html += sessionFilterSelect('agent', 'agents', '所有智能体', f.agent);
      html += sessionFilterSelect('status', 'statuses', '任意状态', f.status);
      return html + '</div>';
    }

    function bindSessionToolbar() {
      var input = document.getElementById('ses-search');
      if (input && !input.__bound) {
        input.__bound = true;
        bindImeSafeSearch(input, 1, function(v) { setSessionFilter('q', v); });
      }
      ['project', 'agent', 'status'].forEach(function(dim) {
        var sel = document.getElementById('ses-' + dim + '-filter');
        if (sel && !sel.__bound) {
          sel.__bound = true;
          sel.addEventListener('change', function() { setSessionFilter(dim, this.value); });
        }
      });
    }

    function sessionFilterDescription() {
      var f = state.sessions.filters;
      var parts = [];
      if (String(f.q || '').trim()) parts.push('搜索“' + esc(f.q) + '”');
      if (f.project) parts.push('项目 <b>' + esc(f.project) + '</b>');
      if (f.agent) parts.push('智能体 <b>' + esc(f.agent) + '</b>');
      if (f.status) parts.push('状态 <b>' + esc(f.status) + '</b>');
      return parts.join(', ');
    }

    function sessionRowHtml(s) {
      var id = sessionId(s);
      var f = state.sessions.filters;
      var selected = state.sessions.selectedId === id;
      var dur = sessionDuration(s);
      var html = '<div class="session-item' + (selected ? ' selected' : '') + '" data-action="select-session" data-session-id="' + esc(id) + '" role="button" tabindex="0" aria-current="' + (selected ? 'true' : 'false') + '">';
      html += '<div class="session-top"><span class="session-project">' + esc(sessionDisplayName(s)) + '</span>';
      html += '<span class="badge ' + (s.status === 'active' ? 'badge-green' : s.status === 'completed' ? 'badge-blue' : 'badge-muted') + '">' + esc(s.status || '未知') + '</span></div>';
      var preview = s.firstPrompt || summaryText(s.summary) || '';
      html += preview ? '<div class="session-preview clamp-2">' + esc(preview) + '</div>' : '<div class="session-preview none">未记录提示词</div>';
      html += '<div class="mem-chips">';
      if (s.agentId) html += '<button type="button" class="mem-chip' + (f.agent === s.agentId ? ' on' : '') + '" data-action="ses-filter" data-dim="agent" data-value="' + esc(s.agentId) + '" title="仅显示智能体 ' + esc(s.agentId) + '">@' + esc(s.agentId) + '</button>';
      html += '<span>' + fmtNum(s.observationCount || 0) + ' 条观测</span><span>&middot;</span>';
      html += '<span title="' + esc(formatTime(s.startedAt)) + '">' + esc(timeAgo(s.startedAt) || '-') + ' (' + esc(absTime(s.startedAt)) + ')</span><span>&middot;</span>';
      html += dur.running ? '<span class="running-dot" title="' + esc(dur.title) + '">运行中</span>' : '<span title="' + esc(dur.title) + '">' + esc(dur.label) + '</span>';
      html += '<span class="ses-id-mini" title="' + esc(id) + '">' + esc(shortId(id, 18)) + '</span>';
      return html + '</div></div>';
    }

    function sessionListHtml(rows) {
      var s = state.sessions;
      var c = store.counts || {};
      var filtered = sessionFiltersActive();
      var html = '';
      if (filtered) {
        var q = s.query;
        var summary = q && q.loading ? '正在服务器上筛选…' : q && q.failed ? '筛选请求失败，请调整筛选条件后重试。' : fmtNum(rows.length) + (q && q.nextCursor ? '+' : '') + ' 个匹配的会话' + '';
        html += '<div class="mem-filter-note"><span>' + summary + '，筛选条件：' + sessionFilterDescription() + '</span><button type="button" class="btn" data-action="ses-clear-filters">全部清除</button></div>';
      }
      if (rows.length === 0) {
        if (filtered && s.query && s.query.loading) return html + skeleton(6);
        if (filtered) {
          html += emptyState({
            icon: '&#128269;',
            title: '没有匹配的会话',
            what: '此列表显示与搜索框以及项目、智能体和状态筛选器匹配的会话。筛选在服务端针对所有会话执行，而不仅限于已加载的页面。',
            why: '没有会话匹配' + sessionFilterDescription() + '.',
            steps: [{ label: '在终端中运行相同的查询：', cmd: curlGet(sessionQueryPath().replace('limit=50', 'limit=20')) }]
          });
          return html + '<div style="margin-top:10px;"><button type="button" class="btn" data-action="ses-clear-filters">清除搜索和筛选</button></div>';
        }
        return html + emptyState({
          icon: '&#128466;',
          title: '尚无会话',
          what: '会话是智能体在项目中的一次完整运行，从开始到结束。每条观测（文件读取、编辑、命令、错误）都归属于某一个会话，而从工作中提炼出的记忆和经验教训也会关联回它。',
          why: '此安装中尚无接入 agentmemory 钩子的智能体启动过会话。',
          steps: [
            { label: '使用钩子接入智能体，使每次运行都被记录（以 Claude Code 为例）：', cmd: connectCmd() },
            { label: '或手动启动一个会话并记录一条观测：', cmd: curlPost('session/start', { sessionId: 'demo-1', project: 'my-project', cwd: '/path/to/project' }) + '\n\n' + curlPost('observe', { hookType: 'post_tool_use', sessionId: 'demo-1', project: 'my-project', cwd: '/path/to/project', timestamp: new Date().toISOString(), data: { tool_name: 'Read', tool_input: { file_path: 'README.md' } } }) }
          ],
          link: { href: 'https://github.com/rohitg00/agentmemory#quick-start', text: '接入智能体' }
        });
      }
      rows.forEach(function(row) { html += sessionRowHtml(row); });
      var cursor = s.query ? s.query.nextCursor : s.nextCursor;
      var total = filtered ? null : c.sessions;
      html += '<div class="load-more">显示 ' + fmtNum(rows.length) + (typeof total === 'number' ? ' / ' + fmtNum(Math.max(total, rows.length)) : '') + (filtered ? ' 个匹配的' : '') + ' 会话（最新在前）';
      if (cursor) html += '<button class="btn" data-action="sessions-load-more"' + (s.loadingMore ? ' disabled' : '') + '>' + (s.loadingMore ? '加载中…' : '加载更多') + '</button>';
      return html + '</div>';
    }

    function renderSessions() {
      var el = document.getElementById('view-sessions');
      var s = state.sessions;
      if (!el.querySelector('#session-list')) {
        el.innerHTML = '<div class="inline-note"><strong>会话</strong> ' + help('session') + ' 是智能体在项目中的单次运行。选择一个会话，按序查看其观测' + help('observation') + '、触及的文件，以及其产生的记忆和经验教训。新会话和观测会实时显示在这里。</div>' +
          '<div id="session-toolbar"></div><div class="sessions-layout" id="sessions-layout"><div id="session-list" class="session-list"></div><div id="session-detail"></div></div>';
        el.__renderedHtml = null;
      }
      var focus = captureSearchFocus(['ses-search']);
      setViewHtml(document.getElementById('session-toolbar'), sessionToolbarHtml());
      bindSessionToolbar();
      restoreSearchFocus(focus);
      var layout = document.getElementById('sessions-layout');
      if (!store.loaded.session) {
        layout.classList.add('has-detail');
        setViewHtml(document.getElementById('session-list'), skeleton(8));
        setViewHtml(document.getElementById('session-detail'), '<div class="detail-panel ses-detail">' + skeleton(10) + '</div>');
        return;
      }
      var rows = sessionRows();
      if (s.autoSelected && s.selectedId && !rows.some(function(r) { return sessionId(r) === s.selectedId; })) {
        s.selectedId = null;
        s.autoSelected = false;
      }
      if (!s.selectedId && !s.closed && rows.length > 0 && window.matchMedia('(min-width: 1101px)').matches) {
        s.selectedId = sessionId(rows[0]);
        s.autoSelected = true;
      }
      setViewHtml(document.getElementById('session-list'), sessionListHtml(rows));
      renderSessionDetailPanel();
      layout.classList.toggle('has-detail', !!document.getElementById('session-detail').firstElementChild);
    }

    function selectSession(id, opts) {
      opts = opts || {};
      var s = state.sessions;
      if (s.selectedId === id && !s.autoSelected && !opts.force) {
        if (!opts.keep) {
          s.selectedId = null;
          s.closed = true;
        }
      } else {
        s.selectedId = id;
        s.closed = false;
      }
      s.autoSelected = false;
      setRouteEntity('sessions', s.selectedId);
      renderSessions();
      if (s.selectedId && window.matchMedia('(max-width: 1100px)').matches) {
        var panel = document.getElementById('session-detail');
        if (panel && panel.scrollIntoView) panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    }

    function closeSessionDetail() {
      state.sessions.selectedId = null;
      state.sessions.autoSelected = false;
      state.sessions.closed = true;
      setRouteEntity('sessions', '');
      renderSessions();
    }

    function newSessionDetail(id) {
      return { id: id, obs: [], total: 0, nextCursor: null, loading: true, loadingMore: false, failed: false, type: '', minImp: 0, types: {}, rev: 0, focusObs: '', produced: { memories: [], loading: true, failed: false, total: 0 } };
    }

    function detailObsPath(d, cursor) {
      var p = 'observations?sessionId=' + encodeURIComponent(d.id) + '&limit=' + SESSION_OBS_PAGE;
      if (d.type) p += '&type=' + encodeURIComponent(d.type);
      if (d.minImp) p += '&minImportance=' + d.minImp;
      if (cursor) p += '&cursor=' + encodeURIComponent(cursor);
      return p;
    }

    function noteObsTypes(d, list) {
      list.forEach(function(o) { d.types[obsType(o)] = true; });
    }

    async function loadSessionObservations(d, more) {
      var path = detailObsPath(d, more ? d.nextCursor : '');
      var key = d.type + '|' + d.minImp;
      if (more) d.loadingMore = true;
      else { d.loading = true; d.obs = []; d.nextCursor = null; }
      d.rev++;
      renderSessionObs();
      var res = await apiGet(path);
      if (state.sessions.detail !== d || d.type + '|' + d.minImp !== key) return;
      d.loading = false;
      d.loadingMore = false;
      if (!res) {
        d.failed = true;
      } else {
        d.failed = false;
        var seen = {};
        d.obs.forEach(function(o) { seen[o.id] = true; });
        (res.observations || []).forEach(function(o) { if (!seen[o.id]) d.obs.push(o); });
        noteObsTypes(d, d.obs);
        d.total = typeof res.total === 'number' ? res.total : d.obs.length;
        d.nextCursor = res.nextCursor || null;
      }
      d.rev++;
      renderSessionHead();
      renderSessionObs();
      revealFocusObs(d);
    }

    async function loadSessionProduced(d) {
      var res = await apiGet('memories?latest=true&sessionId=' + encodeURIComponent(d.id) + '&limit=50');
      if (state.sessions.detail !== d) return;
      d.produced.loading = false;
      if (!res) d.produced.failed = true;
      else {
        d.produced.memories = res.memories || [];
        d.produced.total = typeof res.total === 'number' ? res.total : d.produced.memories.length;
      }
      renderSessionProduced();
    }

    var sessionLookups = {};
    async function lookupSession(id) {
      if (sessionLookups[id]) return;
      sessionLookups[id] = 'loading';
      var res = await apiGet('sessions?limit=20&q=' + encodeURIComponent(id));
      var hit = res && (res.sessions || []).find(function(r) { return sessionKey(r) === id; });
      if (hit) mergeSessionRows([hit]);
      sessionLookups[id] = hit ? 'found' : 'missing';
      if (state.activeTab === 'sessions') renderSessions();
    }

    function ensureSessionDetail(id) {
      var s = state.sessions;
      if (s.detail && s.detail.id === id) return s.detail;
      var d = newSessionDetail(id);
      if (s.pendingObs && s.pendingObs.sid === id) {
        d.focusObs = s.pendingObs.obs;
        s.pendingObs = null;
      }
      s.detail = d;
      Promise.all([ensureLoaded('lesson'), ensureLoaded('crystal')]).then(function() { if (state.sessions.detail === d) renderSessionProduced(); });
      loadSessionObservations(d, false);
      loadSessionProduced(d);
      return d;
    }

    function renderSessionDetailPanel() {
      var panel = document.getElementById('session-detail');
      if (!panel) return;
      var s = state.sessions;
      var id = s.selectedId;
      if (!id) { setViewHtml(panel, ''); panel.__sid = ''; return; }
      var row = store.entities.session[id];
      if (!row) {
        if (!sessionLookups[id]) lookupSession(id);
        panel.__sid = '';
        if (sessionLookups[id] === 'missing') {
          setViewHtml(panel, '<div class="detail-panel ses-detail"><div class="mem-detail-head"><span>会话</span>' + sessionCloseBtn() + '</div>' + emptyState({
            compact: true,
            icon: '&#128269;',
            title: '未找到会话',
            what: '查看器中任何位置的会话链接都会按 ID 打开此面板。',
            why: '没有会话具有该 ID <code>' + esc(id) + '</code>。它已被删除，或该链接来自另一个安装。',
            steps: [{ label: '在终端中检查：', cmd: curlGet('sessions?limit=20&q=' + encodeURIComponent(id)) }]
          }) + '</div>');
        } else {
          setViewHtml(panel, '<div class="detail-panel ses-detail"><div class="mem-detail-head"><span>正在加载会话 ' + esc(shortId(id, 22)) + '…</span>' + sessionCloseBtn() + '</div>' + skeleton(8) + '</div>');
        }
        return;
      }
      ensureSessionDetail(id);
      if (panel.__sid !== id || !panel.querySelector('#ses-head')) {
        panel.innerHTML = '<div class="detail-panel ses-detail" data-detail-id="' + esc(id) + '"><div id="ses-head"></div><div id="ses-produced"></div><div id="ses-obs"></div></div>';
        panel.__renderedHtml = null;
        panel.__sid = id;
      }
      renderSessionHead();
      renderSessionProduced();
      renderSessionObs();
    }

    function sessionCloseBtn() {
      return '<button type="button" class="icon-btn icon-close" data-action="ses-close" aria-label="关闭会话详情">关闭</button>';
    }

    function sessionToolStats(d) {
      var tools = {};
      var files = {};
      d.obs.forEach(function(o) {
        var t = obsType(o);
        var tool = o.toolName || (o.origin && o.origin.channel === 'tool' ? o.origin.detail : '') || (t !== 'conversation' && t !== 'other' ? o.title : '');
        if (tool) tools[tool] = (tools[tool] || 0) + 1;
        (o.files || []).forEach(function(f) { files[f] = (files[f] || 0) + 1; });
        var ti = o.toolInput;
        if (ti && typeof ti === 'object' && (ti.file_path || ti.path)) files[ti.file_path || ti.path] = (files[ti.file_path || ti.path] || 0) + 1;
      });
      return { tools: tools, files: files };
    }

    function relPath(f, cwd) {
      var p = String(f || '');
      if (cwd && p.indexOf(cwd + '/') === 0) return p.slice(cwd.length + 1);
      return p;
    }

    function sessionSummaryHtml(sum) {
      if (!sum) return '';
      if (typeof sum === 'string') return '<div class="mem-section"><div class="mem-section-title">摘要</div><div class="ses-summary">' + esc(sum) + '</div></div>';
      var html = '<div class="mem-section"><div class="mem-section-title">摘要</div>';
      if (sum.title) html += '<div class="ses-summary"><b>' + esc(sum.title) + '</b></div>';
      if (sum.narrative) html += '<div class="ses-summary">' + esc(sum.narrative) + '</div>';
      if (Array.isArray(sum.keyDecisions) && sum.keyDecisions.length) html += '<ul class="obs-facts">' + sum.keyDecisions.map(function(k) { return '<li>' + esc(k) + '</li>'; }).join('') + '</ul>';
      return html + '</div>';
    }

    function sessionHeadHtml(s, d) {
      var id = sessionId(s);
      var dur = sessionDuration(s);
      var stats = sessionToolStats(d);
      var toolKeys = Object.keys(stats.tools).sort(function(a, b) { return stats.tools[b] - stats.tools[a]; });
      var fileKeys = Object.keys(stats.files).sort(function(a, b) { return stats.files[b] - stats.files[a]; });
      var partial = d.nextCursor || d.type || d.minImp;
      var html = '<div class="mem-detail-head"><span class="badge ' + (s.status === 'active' ? 'badge-green' : 'badge-blue') + '">' + esc(s.status || '未知') + '</span>' + help('sessionStatus');
      html += '<span>' + esc(sessionDisplayName(s)) + '</span>';
      if (s.agentId) html += '<span>· @' + esc(s.agentId) + '</span>';
      html += '<span>· 开始于 ' + relTime(s.startedAt) + '</span>' + sessionCloseBtn() + '</div>';
      var prompt = s.firstPrompt || summaryText(s.summary) || '';
      html += prompt ? '<div class="mem-detail-content ses-prompt">' + esc(truncate(prompt, 600)) + '</div>' : '<div class="mem-detail-content ses-prompt none">此会话未记录初始提示词。</div>';

      html += '<div class="mem-actions">';
      html += copyBtn(id, '会话 ID').replace('>复制<', '>复制 ID<');
      html += copyBtn(curlGet('observations?sessionId=' + encodeURIComponent(id) + '&limit=50'), 'curl 命令').replace('>复制<', '>复制 curl<');
      html += copyBtn('memory_timeline { "anchor": ' + JSON.stringify(s.startedAt || '') + ', "project": ' + JSON.stringify(s.project || '') + ', "after": 20 }', 'MCP 调用').replace('>复制<', '>复制 MCP 调用<');
      html += '<a class="btn" href="#replay" data-replay-session="' + esc(id) + '">回放</a>';
      html += '<span class="ses-danger-actions">';
      if (s.status === 'active') html += '<button type="button" class="btn btn-danger" data-action="ses-end" data-session-id="' + esc(id) + '">结束会话…</button>';
      html += '<button type="button" class="btn" data-action="ses-summarize" data-session-id="' + esc(id) + '"' + (state.sessions.summarizing === id ? ' disabled' : '') + '>' + (state.sessions.summarizing === id ? '正在生成摘要…' : '生成摘要…') + '</button>';
      html += '</span></div>';
      if (state.sessions.notice && state.sessions.notice.id === id) html += '<div class="mem-note' + (state.sessions.notice.err ? ' err' : '') + '" role="status">' + state.sessions.notice.html + '</div>';

      html += '<div class="ses-stats">';
      html += '<div><span>' + fmtNum(s.observationCount || d.total || 0) + '</span><small>观测 ' + help('observation') + '</small></div>';
      html += '<div><span>' + fmtNum(toolKeys.length) + '</span><small>使用的工具' + (partial ? '*' : '') + '</small></div>';
      html += '<div><span>' + fmtNum(fileKeys.length) + '</span><small>触及的文件' + (partial ? '*' : '') + '</small></div>';
      html += '<div title="' + esc(dur.title) + '"><span>' + esc(dur.running ? (dur.span ? dur.span + '+' : '运行中') : dur.label) + '</span><small>' + (dur.running ? '已运行时长' : '持续时间') + '</small></div>';
      html += '</div>';
      if (partial) html += '<div class="ses-foot">* 统计基于下方已加载的 ' + fmtNum(d.obs.length) + ' 条' + '' + '观测' + (d.type || d.minImp ? '（当前筛选条件下）' : '') + '。加载更多可扩大统计范围。</div>';

      html += '<div class="mem-section"><div class="mem-section-title">详情</div><dl class="mem-meta">';
      html += '<dt>ID</dt><dd>' + idChip('session', id) + '</dd>';
      html += '<dt>项目 ' + help('project') + '</dt><dd>' + (s.project ? '<button type="button" class="mem-chip" data-action="ses-filter" data-dim="project" data-value="' + esc(s.project) + '" title="仅显示此项目">' + esc(s.project) + '</button>' : '<span style="color:var(--ink-faint);">无</span>') + '</dd>';
      html += '<dt>智能体 ' + help('agent') + '</dt><dd>' + (s.agentId ? '<button type="button" class="mem-chip" data-action="ses-filter" data-dim="agent" data-value="' + esc(s.agentId) + '" title="仅显示此智能体">@' + esc(s.agentId) + '</button>' : '<span style="color:var(--ink-faint);">未记录</span>') + '</dd>';
      html += '<dt>开始时间</dt><dd>' + relTime(s.startedAt) + ' <span style="color:var(--ink-faint);">（' + esc(formatTime(s.startedAt)) + '）</span></dd>';
      if (s.endedAt && s.status !== 'active') html += '<dt>结束时间</dt><dd>' + relTime(s.endedAt) + ' <span style="color:var(--ink-faint);">（' + esc(formatTime(s.endedAt)) + '）</span></dd>';
      else html += '<dt>最近动态</dt><dd>' + relTime(s.updatedAt || s.startedAt) + ' <span style="color:var(--ink-faint);">（仍在运行；实时更新）</span></dd>';
      if (s.cwd) html += '<dt>目录</dt><dd><code>' + esc(s.cwd) + '</code></dd>';
      if (s.model) html += '<dt>模型</dt><dd>' + esc(s.model) + '</dd>';
      if (asTags(s.tags).length) html += '<dt>标签</dt><dd>' + asTags(s.tags).map(function(t) { return '<span class="tag">' + esc(t) + '</span>'; }).join(' ') + '</dd>';
      if (toolKeys.length) html += '<dt>工具</dt><dd class="tag-list" style="margin:0;">' + toolKeys.slice(0, 16).map(function(t) { return '<span class="tag">' + esc(t) + ' &times;' + stats.tools[t] + '</span>'; }).join('') + '</dd>';
      if (fileKeys.length) {
        html += '<dt>文件</dt><dd class="tag-list" style="margin:0;">' + fileKeys.slice(0, 24).map(function(f) { return '<span class="tag file-tag" title="' + esc(f) + ' (' + stats.files[f] + '&times;)">' + esc(relPath(f, s.cwd)) + '</span>'; }).join('') + (fileKeys.length > 24 ? '<span class="ses-foot">+' + (fileKeys.length - 24) + ' 更多</span>' : '') + '</dd>';
      }
      html += '</dl></div>';
      html += sessionSummaryHtml(s.summary);
      return html;
    }

    function renderSessionHead() {
      var host = document.getElementById('ses-head');
      var d = state.sessions.detail;
      if (!host || !d) return;
      var s = store.entities.session[d.id];
      if (!s) return;
      setViewHtml(host, sessionHeadHtml(s, d));
    }

    function sessionLessons(id) {
      var memIds = {};
      var d = state.sessions.detail;
      if (d && d.id === id) d.produced.memories.forEach(function(m) { memIds[m.id] = true; });
      entityList('memory').forEach(function(m) { if ((m.sessionIds || []).indexOf(id) >= 0) memIds[m.id] = true; });
      var crystalIds = {};
      entityList('crystal').forEach(function(c) { if (c.sessionId === id) crystalIds[c.id] = true; });
      return sortByTimeDesc(entityList('lesson').filter(function(l) {
        if (l.deleted) return false;
        return (l.sourceIds || []).some(function(src) { return src === id || crystalIds[src] || memIds[src]; });
      }), ['updatedAt', 'createdAt']);
    }

    function sessionProducedHtml(d) {
      var s = store.entities.session[d.id] || {};
      var p = d.produced;
      var lessons = sessionLessons(d.id);
      var html = '<div class="mem-section"><div class="mem-section-title">由此会话产生 ' + help('provenance') + '</div>';
      if (p.loading) return html + skeleton(2) + '</div>';
      if (!p.memories.length && !lessons.length) {
        var newest = d.obs[0];
        html += '<div class="empty-step-label">尚无内容关联到这里。当一条记忆通过整合（需要 LLM）从其观测中提炼，或保存时附带 <code>sourceObservationIds</code>，它会关联到此会话；当一条经验教训从此会话结晶而来，它也会关联到这里。' + (p.failed ? ' 查找失败，请重新打开会话重试。' : '') + '</div>';
        if (newest) html += cmdBlock(curlPost('remember', { content: 'What the agent learned in this session', type: 'fact', project: s.project || undefined, sourceObservationIds: [newest.id] }));
        return html + '</div>';
      }
      html += '<dl class="mem-meta">';
      if (p.memories.length) {
        html += '<dt>记忆 ' + help('memory') + '</dt><dd><ul class="ses-links">' + p.memories.slice(0, 12).map(function(m) {
          return '<li><span class="badge ' + (TYPE_BADGES[m.type] || 'badge-muted') + '">' + esc(m.type || 'memory') + '</span> ' + entityLink('memory', m.id, truncate(memoryHeadline(m).head, 110)) + '</li>';
        }).join('') + '</ul>' + (p.total > 12 ? '<div class="ses-foot">+' + fmtNum(p.total - 12) + ' 个。' + copyBtn(curlGet('memories?latest=true&sessionId=' + encodeURIComponent(d.id)), 'curl 命令').replace('>复制<', '>复制全部 curl<') + '</div>' : '') + '</dd>';
      }
      if (lessons.length) {
        html += '<dt>经验教训 ' + help('lesson') + '</dt><dd><ul class="ses-links">' + lessons.slice(0, 8).map(function(l) {
          return '<li>' + entityLink('lesson', l.id, truncate(l.content || l.id, 110)) + '</li>';
        }).join('') + '</ul></dd>';
      }
      return html + '</dl></div>';
    }

    function renderSessionProduced() {
      var host = document.getElementById('ses-produced');
      var d = state.sessions.detail;
      if (!host || !d) return;
      setViewHtml(host, sessionProducedHtml(d));
    }

    function splitNarrative(n) {
      var text = String(n || '');
      if (text.charAt(0) !== '{') return { input: null, output: text };
      var at = text.indexOf('} | ');
      while (at >= 0) {
        try {
          var parsed = JSON.parse(text.slice(0, at + 1));
          if (parsed && typeof parsed === 'object') return { input: parsed, output: text.slice(at + 4) };
        } catch (_) {}
        at = text.indexOf('} | ', at + 1);
      }
      try {
        var whole = JSON.parse(text);
        if (whole && typeof whole === 'object') return { input: whole, output: '' };
      } catch (_) {}
      return { input: null, output: text };
    }

    function obsCodeHtml(text, label) {
      var str = String(text);
      var lines = str.split('\n').length;
      return '<div class="obs-block"><div class="obs-block-label">' + esc(label) + (lines > 12 ? ' <span>' + fmtNum(lines) + ' 行，可滚动</span>' : '') + '</div><pre class="obs-code">' + esc(truncate(str, 20000)) + '</pre></div>';
    }

    function obsFieldsHtml(input, cwd, skip) {
      if (input === null || input === undefined || input === '') return '';
      if (typeof input !== 'object') return obsCodeHtml(input, 'Input');
      var keys = Object.keys(input);
      if (!keys.length) return '';
      var inline = [];
      var blocks = [];
      keys.forEach(function(k) {
        var v = input[k];
        var label = k.replace(/_/g, ' ');
        if (v !== null && typeof v === 'object') { blocks.push(obsCodeHtml(JSON.stringify(v, null, 2), label)); return; }
        var sv = String(v);
        if (sv.length > 140 || sv.indexOf('\n') >= 0) { blocks.push(obsCodeHtml(sv, label)); return; }
        if (skip && sv === skip) return;
        var shown = /path$|^file/.test(k) ? relPath(sv, cwd) : sv;
        inline.push('<dt>' + esc(label) + '</dt><dd><code title="' + esc(sv) + '">' + esc(shown) + '</code></dd>');
      });
      return (inline.length ? '<dl class="obs-fields">' + inline.join('') + '</dl>' : '') + blocks.join('');
    }

    function obsBodyHtml(o, cwd, sub) {
      var type = obsType(o);
      var html = '';
      if (o.toolInput !== undefined || o.toolOutput !== undefined || o.userPrompt) {
        if (o.userPrompt) html += '<div class="obs-prompt">' + esc(o.userPrompt) + '</div>';
        var ti = o.toolInput;
        if (typeof ti === 'string') { try { var pj = JSON.parse(ti); if (pj && typeof pj === 'object') ti = pj; } catch (_) {} }
        html += obsFieldsHtml(ti, cwd, sub);
        var out = o.toolOutput !== undefined ? o.toolOutput : o.error;
        if (out !== undefined && out !== null && out !== '') html += obsCodeHtml(typeof out === 'string' ? out : JSON.stringify(out, null, 2), type === 'error' ? 'Error' : '输出');
        return html;
      }
      if (o.narrative) {
        if (type === 'conversation') return '<div class="obs-prompt">' + esc(o.narrative) + '</div>';
        var parts = splitNarrative(o.narrative);
        if (parts.input) {
          html += obsFieldsHtml(parts.input, cwd, sub);
          if (parts.output) html += obsCodeHtml(parts.output, type === 'error' ? 'Error' : '输出');
        } else {
          html += '<div class="obs-narrative">' + esc(humanizeNarrative(o.narrative)) + '</div>';
        }
      }
      if (o.facts && o.facts.length) html += '<ul class="obs-facts">' + o.facts.map(function(f) { return '<li>' + esc(f) + '</li>'; }).join('') + '</ul>';
      return html;
    }

    function obsItemHtml(o, cwd, sid) {
      var type = obsType(o);
      var color = OBS_TYPE_COLORS[type] || '#666666';
      var title = o.title || o.toolName || (o.hookType ? o.hookType.replace(/_/g, ' ') : '观测');
      if (type === 'conversation' && (title === 'prompt_submit' || o.hookType === 'prompt_submit')) title = '用户提示词';
      var sub = o.subtitle ? humanizeSubtitle(o.subtitle) : '';
      if (!sub && o.toolInput && typeof o.toolInput === 'object') sub = o.toolInput.file_path || o.toolInput.path || o.toolInput.command || o.toolInput.pattern || '';
      if (sub && sub.charAt(0) === '{') sub = '';
      if (!sub && o.narrative && obsType(o) !== 'conversation') {
        var pin = splitNarrative(o.narrative).input;
        if (pin) sub = pin.file_path || pin.path || pin.command || pin.pattern || pin.url || pin.query || '';
      }
      sub = typeof sub === 'string' ? sub : '';
      var imp = typeof o.importance === 'number' ? o.importance : null;
      var focus = state.sessions.detail && state.sessions.detail.focusObs === o.id;
      var html = '<li class="obs-item' + (focus ? ' focus' : '') + '" id="obs-' + esc(o.id) + '" data-obs-id="' + esc(o.id) + '" style="--obs-color:' + color + ';">';
      html += '<div class="obs-item-head">';
      html += '<span class="obs-type-chip">' + esc(type.replace(/_/g, ' ')) + '</span>';
      html += '<span class="obs-item-title">' + esc(title) + '</span>';
      if (sub) html += '<span class="obs-item-sub" title="' + esc(sub) + '">' + esc(relPath(sub, cwd)) + '</span>';
      html += '<span class="obs-item-meta">';
      if (imp !== null) html += '<span class="obs-importance imp-' + imp + '" title="重要度 ' + imp + ' / 10，' + (imp >= 7 ? '高' : imp >= 4 ? '中' : '低') + '.">' + imp + '</span>';
      else html += '<span class="obs-importance raw" title="刚刚捕获。观测被压缩时将设定重要度。">·</span>';
      html += copyBtn(o.id, '观测 ID').replace('>复制<', '>复制 ID<');
      html += '<a class="obs-time" href="#sessions/' + encodeURIComponent(sid) + '?obs=' + encodeURIComponent(o.id) + '" title="' + esc(formatTime(o.timestamp)) + '。链接到这条观测。">' + esc(shortTime(o.timestamp)) + '</a>';
      html += '</span></div>';
      html += '<div class="obs-item-body">' + obsBodyHtml(o, cwd, sub);
      var files = (o.files || []).filter(function(f) { return relPath(f, cwd) !== relPath(sub, cwd); });
      if (files.length || (o.concepts && o.concepts.length)) {
        html += '<div class="tag-list">' + (o.concepts || []).map(function(c) { return '<span class="tag">' + esc(c) + '</span>'; }).join('') + files.map(function(f) { return '<span class="tag file-tag" title="' + esc(f) + '">' + esc(relPath(f, cwd)) + '</span>'; }).join('') + '</div>';
      }
      return html + '</div></li>';
    }

    function sessionObsControlsHtml(d) {
      var html = '<div class="type-chips">';
      html += '<span class="type-chip' + (!d.type ? ' active' : '') + '" role="button" tabindex="0" data-action="ses-obs-type" data-type-filter="">全部' + (!d.type && !d.minImp ? ' (' + fmtNum(d.total) + ')' : '') + '</span>';
      Object.keys(d.types).sort().forEach(function(t) {
        var color = OBS_TYPE_COLORS[t] || '#666666';
        var on = d.type === t;
        html += '<span class="type-chip' + (on ? ' active' : '') + '" role="button" tabindex="0" data-action="ses-obs-type" data-type-filter="' + esc(t) + '" style="' + (on ? 'background:' + color + ';border-color:' + color + ';' : 'border-color:' + color + ';color:' + color + ';') + '">' + esc(t.replace(/_/g, ' ')) + (on ? ' (' + fmtNum(d.total) + ')' : '') + '</span>';
      });
      html += '<select id="ses-obs-imp" aria-label="最低重要度"><option value="0">任意重要度</option>';
      [4, 7].forEach(function(i) { html += '<option value="' + i + '"' + (d.minImp === i ? ' selected' : '') + '>重要度 ' + i + '+</option>'; });
      return html + '</select></div>';
    }

    function sessionObsHtml(d) {
      var s = store.entities.session[d.id] || {};
      var html = '<div class="mem-section"><div class="mem-section-title">观测 ' + help('observation') + ' <span class="ses-live-note">最新在前 · 重要度 ' + help('importance') + ' · 实时更新</span></div>';
      html += sessionObsControlsHtml(d);
      if (d.loading) return html + skeleton(6) + '</div>';
      if (!d.obs.length) {
        if (d.type || d.minImp) {
          html += emptyState({
            compact: true,
            icon: '&#128337;',
            title: '没有匹配的观测',
            what: '类型筛选器和重要度选择器会在服务端缩小此列表。',
            why: '此会话中没有' + (d.type ? '类型为 <b>' + esc(d.type.replace(/_/g, ' ')) + '</b>' : '') + (d.type && d.minImp ? '、' : '') + (d.minImp ? '重要度 ' + d.minImp + ' 或更高的观测' : '') + '.',
            steps: [{ label: '请选择"全部"，或选择"任意重要度"。' }]
          });
        } else {
          html += emptyState({
            compact: true,
            icon: '&#128337;',
            title: d.failed ? '观测加载失败' : '尚无观测',
            what: '观测是智能体所做的具体事项：提示词、文件读取与编辑、命令、搜索、错误。',
            why: d.failed ? '请求失败。请确认 agentmemory 正在运行，然后重新打开会话。' : s.status === 'active' ? '会话正在运行，但尚未捕获到工具使用。新的工具使用一到达就会显示在这里。' : '此会话在捕获到任何工具使用之前就已结束。',
            steps: [{ label: '手动记录一条，实时查看它到达：', cmd: curlPost('observe', { hookType: 'post_tool_use', sessionId: d.id, project: s.project || 'my-project', cwd: s.cwd || '/path/to/project', timestamp: new Date().toISOString(), data: { tool_name: 'Read', tool_input: { file_path: 'README.md' } } }) }]
          });
        }
        return html + '</div>';
      }
      html += '<ol class="obs-timeline" id="ses-obs-list">';
      d.obs.forEach(function(o) { html += obsItemHtml(o, s.cwd, d.id); });
      html += '</ol>';
      html += '<div class="load-more" id="ses-obs-more">' + sessionObsMoreHtml(d) + '</div>';
      return html + '</div>';
    }

    function sessionObsMoreHtml(d) {
      var html = '显示 ' + fmtNum(d.obs.length) + ' / ' + fmtNum(Math.max(d.total, d.obs.length)) + (d.type || d.minImp ? ' 个匹配的' : '') + ' 条观测';
      if (d.nextCursor) html += '<button class="btn" data-action="ses-obs-more"' + (d.loadingMore ? ' disabled' : '') + '>' + (d.loadingMore ? '加载中…' : '加载 ' + SESSION_OBS_PAGE + ' 条') + '</button>';
      return html;
    }

    function renderSessionObs() {
      var host = document.getElementById('ses-obs');
      var d = state.sessions.detail;
      if (!host || !d) return;
      if (host.__rev === d.rev && host.__detail === d) return;
      host.__rev = d.rev;
      host.__detail = d;
      host.innerHTML = sessionObsHtml(d);
      host.__renderedHtml = null;
      var sel = document.getElementById('ses-obs-imp');
      if (sel) sel.addEventListener('change', function() { setSessionObsFilter(d.type, parseInt(this.value, 10) || 0); });
    }

    function setSessionObsFilter(type, minImp) {
      var d = state.sessions.detail;
      if (!d) return;
      d.type = type;
      d.minImp = minImp;
      loadSessionObservations(d, false);
      renderSessionHead();
    }

    function obsMatchesDetail(d, o) {
      if (d.type && obsType(o) !== d.type) return false;
      if (d.minImp && !(typeof o.importance === 'number' && o.importance >= d.minImp)) return false;
      return true;
    }

    function liveSessionObservation(o) {
      var d = state.sessions.detail;
      if (!d || d.id !== o.sessionId || d.loading) return;
      var s = store.entities.session[d.id] || {};
      var idx = d.obs.findIndex(function(x) { return x.id === o.id; });
      var list = document.getElementById('ses-obs-list');
      var inView = state.activeTab === 'sessions' && list && document.getElementById('ses-obs').__detail === d;
      if (idx >= 0) {
        d.obs[idx] = o.narrative || o.type ? o : Object.assign({}, d.obs[idx], o);
        d.types[obsType(d.obs[idx])] = true;
        var node = inView ? document.getElementById('obs-' + o.id) : null;
        if (node) node.outerHTML = obsItemHtml(d.obs[idx], s.cwd, d.id);
        else d.rev++;
      } else {
        if (!obsMatchesDetail(d, o)) return;
        var newType = !d.types[obsType(o)];
        d.types[obsType(o)] = true;
        d.obs.unshift(o);
        d.total++;
        if (inView && !newType) {
          list.insertAdjacentHTML('afterbegin', obsItemHtml(o, s.cwd, d.id).replace('class="obs-item', 'class="obs-item fresh'));
          var more = document.getElementById('ses-obs-more');
          if (more) more.innerHTML = sessionObsMoreHtml(d);
        } else {
          d.rev++;
        }
      }
      if (state.activeTab === 'sessions') {
        renderSessionObs();
        renderSessionHead();
      }
    }

    function noteSessionProduced(change) {
      var d = state.sessions.detail;
      if (!d || d.produced.loading) return;
      var list = d.produced.memories;
      var idx = list.findIndex(function(m) { return m.id === change.id; });
      var row = change.row;
      var links = !!row && row.isLatest !== false && ((row.sessionIds || []).indexOf(d.id) >= 0 || (row.sourceObservationIds || []).some(function(oid) { return d.obs.some(function(o) { return o.id === oid; }); }));
      if (idx >= 0 && !links) {
        list.splice(idx, 1);
        d.produced.total = Math.max(0, d.produced.total - 1);
      } else if (idx >= 0) {
        list[idx] = row;
      } else if (links) {
        list.unshift(row);
        d.produced.total++;
      } else {
        return;
      }
      if (state.activeTab === 'sessions') renderSessionProduced();
    }

    function revealFocusObs(d) {
      if (!d.focusObs || d.loading) return;
      var hit = d.obs.some(function(o) { return o.id === d.focusObs; });
      if (!hit) {
        if (d.nextCursor && !d.loadingMore && (d.focusPages || 0) < 40) {
          d.focusPages = (d.focusPages || 0) + 1;
          loadSessionObservations(d, true);
        } else if (!d.nextCursor) {
          state.sessions.notice = { id: d.id, err: true, html: '观测 <code>' + esc(d.focusObs) + '</code> 不在此会话中' + (d.type || d.minImp ? '（当前筛选条件下）' : '') + '.' };
          d.focusObs = '';
          renderSessionHead();
        }
        return;
      }
      if (state.activeTab !== 'sessions') return;
      var el = document.getElementById('obs-' + d.focusObs);
      if (el && el.scrollIntoView) el.scrollIntoView({ block: 'center' });
    }

    function focusSessionObservation(sid, obsId) {
      var s = state.sessions;
      if (s.detail && s.detail.id === sid) {
        s.detail.focusObs = obsId;
        s.detail.focusPages = 0;
        s.detail.rev++;
        renderSessionObs();
        revealFocusObs(s.detail);
      } else {
        s.pendingObs = { sid: sid, obs: obsId };
      }
    }

    function openEndSessionModal(id) {
      var s = store.entities.session[id];
      if (!s) return;
      var llm = store.provider !== 'noop';
      openModal('<h3>结束此会话？</h3>' +
        '<p>将 <b>' + esc(sessionDisplayName(s)) + '</b>（<code>' + esc(shortId(id, 22)) + '</code>）标记为已完成，并记录当前时间为结束时间。这不会停止智能体：如果它继续工作，其观测仍会记录在此会话 ID 下。</p>' +
        '<p>结束时会运行与智能体自身停止钩子相同的收尾流程：' + (llm ? 'LLM 生成的会话摘要、知识图谱抽取，以及（启用整合时）结晶和经验教训。' : '若未配置 LLM 提供方，将跳过摘要和图谱抽取，此时结束操作仅更改状态。') + '</p>' +
        '<p style="font-size:11px;">在终端中执行相同的调用：<code>' + esc(curlPost('session/end', { sessionId: id }).replace(/\s*\\\n\s*/g, ' ')) + '</code></p>' +
        '<div class="modal-actions"><button class="btn" data-action="close-modal">取消</button><button class="btn btn-danger" data-action="ses-confirm-end" data-session-id="' + esc(id) + '">结束会话</button></div>');
    }

    function openSummarizeModal(id) {
      var s = store.entities.session[id];
      if (!s) return;
      var llm = store.provider !== 'noop';
      var body = '<h3>为此会话生成摘要？</h3>' +
        '<p>LLM 会读取 <b>' + esc(sessionDisplayName(s)) + '</b> (' + fmtNum(s.observationCount || 0) + '）的观测并撰写简短摘要：标题、事件经过和关键决策。摘要将显示在这里和会话列表中，之后还会用于整合成事实与流程。再次运行会替换旧摘要。</p>';
      if (!llm) {
        body += '<div class="mem-note err">未配置 LLM 提供方，因此"生成摘要"不会执行任何操作。请设置密钥并重启 agentmemory：</div>' + cmdBlock('export ANTHROPIC_API_KEY=sk-ant-...\nnpx @agentmemory/agentmemory');
        body += '<div class="modal-actions" style="margin-top:14px;"><button class="btn" data-action="close-modal">关闭</button></div>';
      } else {
        body += '<p style="font-size:11px;">在终端中执行相同的调用：<code>' + esc(curlPost('summarize', { sessionId: id }).replace(/\s*\\\n\s*/g, ' ')) + '</code></p>';
        body += '<div class="modal-actions"><button class="btn" data-action="close-modal">取消</button><button class="btn btn-primary" data-action="ses-confirm-summarize" data-session-id="' + esc(id) + '">生成摘要</button></div>';
      }
      openModal(body, llm ? '[data-action="ses-confirm-summarize"]' : '[data-action="close-modal"]');
    }

    async function endSession(id) {
      closeModal();
      var res = await apiPost('session/end', { sessionId: id });
      state.sessions.notice = res && res.success !== false
        ? { id: id, html: '会话已结束。收尾流程（摘要、图谱、整合）在后台运行，结果会实时显示在这里。' }
        : { id: id, err: true, html: '结束会话失败。请确认 agentmemory 正在运行，然后重试。' };
      renderSessionHead();
    }

    var SUMMARIZE_ERRORS = {
      no_provider: '未配置 LLM 提供方，因此未生成摘要。请设置 ANTHROPIC_API_KEY（或其他提供方的密钥）并重启 agentmemory。',
      no_observations: '此会话尚无可用于生成摘要的观测。',
      session_not_found: 'agentmemory 中已不存在此会话。'
    };

    async function summarizeSession(id) {
      closeModal();
      state.sessions.summarizing = id;
      state.sessions.notice = null;
      renderSessionHead();
      var res = await apiPost('summarize', { sessionId: id });
      state.sessions.summarizing = '';
      if (res && res.success !== false) {
        state.sessions.notice = { id: id, html: '摘要已保存，显示在下方的"详情"区域。' };
        if (res.summary && store.entities.session[id]) store.entities.session[id].summary = res.summary;
      } else {
        var code = res && res.error;
        state.sessions.notice = { id: id, err: true, html: esc(SUMMARIZE_ERRORS[code] || ('生成摘要失败' + (code ? ': ' + code : '。请确认 agentmemory 正在运行。'))) };
      }
      renderSessionHead();
    }

    function handleSessionAction(action, target) {
      var id = target.getAttribute('data-session-id') || '';
      if (action === 'ses-close') { closeSessionDetail(); return; }
      if (action === 'ses-filter') {
        var dim = target.getAttribute('data-dim');
        var value = target.getAttribute('data-value') || '';
        if (dim) setSessionFilter(dim, state.sessions.filters[dim] === value ? '' : value);
        return;
      }
      if (action === 'ses-clear-filters') { clearSessionFilters(); return; }
      if (action === 'ses-obs-type') {
        var d = state.sessions.detail;
        if (d) setSessionObsFilter(target.getAttribute('data-type-filter') || '', d.minImp);
        return;
      }
      if (action === 'ses-obs-more') {
        if (state.sessions.detail) loadSessionObservations(state.sessions.detail, true);
        return;
      }
      if (action === 'ses-end') { openEndSessionModal(id); return; }
      if (action === 'ses-confirm-end') { endSession(id); return; }
      if (action === 'ses-summarize') { openSummarizeModal(id); return; }
      if (action === 'ses-confirm-summarize') { summarizeSession(id); return; }
    }

    function isFresh(id) {
      var at = state.freshRows[id];
      return !!at && Date.now() - at < 3000;
    }

    function confColor(pct) {
      return pct >= 70 ? 'var(--green)' : pct >= 40 ? 'var(--yellow)' : 'var(--red)';
    }

    function listDetailShell(el, kind, note) {
      if (!el.querySelector('#' + kind + '-list')) {
        el.innerHTML = '<div id="' + kind + '-note"></div><div id="' + kind + '-toolbar"></div><div class="list-detail" id="' + kind + '-layout"><div id="' + kind + '-list"></div><div class="ld-detail" id="' + kind + '-detail"></div></div>';
        el.__renderedHtml = null;
      }
      setViewHtml(document.getElementById(kind + '-note'), note || '');
    }

    function sourceItemHtml(id) {
      var kind = idKind(id);
      var text = '';
      if (kind === 'session') {
        var s = store.entities.session[id];
        text = s ? sessionDisplayName(s) + (s.firstPrompt ? ': ' + s.firstPrompt : '') : '';
      } else if (kind === 'memory') {
        var m = store.entities.memory[id];
        text = m ? memoryHeadline(m).head : '';
      } else if (kind === 'crystal') {
        var c = store.entities.crystal[id];
        text = c ? c.narrative || '' : '';
      } else if (kind === 'action') {
        var a = store.entities.action[id];
        text = a ? a.title || '' : '';
      }
      return '<li><span class="kind-tag">' + esc(ID_KIND_LABELS[kind] || 'record') + '</span>' + anyIdChip(id) + (text ? '<span class="src-text" title="' + esc(text) + '">' + esc(text) + '</span>' : '') + '</li>';
    }

    function lessonRows() {
      var l = state.lessons;
      var search = String(l.search || '').trim().toLowerCase();
      return sortByTimeDesc(entityList('lesson').filter(function(x) {
        if (!x || x.deleted === true) return false;
        if (l.projectFilter && (x.project || '') !== l.projectFilter) return false;
        if (search && (String(x.content || '') + ' ' + String(x.context || '') + ' ' + asTags(x.tags).join(' ')).toLowerCase().indexOf(search) < 0) return false;
        return true;
      }), ['updatedAt', 'createdAt']);
    }

    function lessonToolbarHtml(total) {
      var l = state.lessons;
      var projects = {};
      entityList('lesson').forEach(function(x) { if (x && !x.deleted) projects[x.project || ''] = (projects[x.project || ''] || 0) + 1; });
      var html = '<div class="toolbar mem-filters">';
      html += '<input id="lessons-search" type="search" placeholder="按文本、原因或标签筛选经验教训（按 /）" value="' + esc(l.search) + '" aria-label="筛选经验教训">';

    async function strengthenLesson(id) {
      var l = state.lessons;
      l.busy = id;
      renderLessons();
      var res = await apiPost('lessons/strengthen', { lessonId: id });
      l.busy = '';
      l.notice = res && res.success !== false
        ? { id: id, html: '已记录一次新的使用。置信度和使用次数将通过实时流在此更新。' }
        : { id: id, err: true, html: '加强失败' + (res && res.error ? ': ' + esc(res.error) : '。请确认 agentmemory 正在运行。') };
      renderLessons();
    }

    function openLessonDeleteModal(id) {
      var x = store.entities.lesson[id];
      if (!x) return;
      openModal('<h3>删除这条经验教训？</h3>' +
        '<p>“' + esc(truncate(x.content, 140)) + '” 将不再被智能体回忆。它会被软删除并记入审计日志；之后再次保存相同文本会创建一条全新的记录。</p>' +
        '<p style="font-size:11px;">在终端中执行相同的调用：<code>' + esc(curlPost('lessons/delete', { lessonId: id }).replace(/\s*\\\n\s*/g, ' ')) + '</code></p>' +
        '<div class="modal-actions"><button class="btn" data-action="close-modal">取消</button><button class="btn btn-danger" data-action="lesson-confirm-delete" data-lesson-id="' + esc(id) + '">删除经验教训</button></div>');
    }

    async function deleteLesson(id) {
      closeModal();
      var res = await apiPost('lessons/delete', { lessonId: id });
      if (res && res.success !== false) {
        state.lessons.selectedId = null;
        setRouteEntity('lessons', '');
      } else {
        state.lessons.notice = { id: id, err: true, html: '删除失败' + (res && res.error ? ': ' + esc(res.error) : '。请确认 agentmemory 正在运行。') };
      }
      renderLessons();
    }

    function actionRows() {
      var a = state.actions;
      var search = String(a.search || '').trim().toLowerCase();
      return entityList('action').filter(function(x) {
        if (!x) return false;
        if (a.statusFilter && x.status !== a.statusFilter) return false;
        if (search && (String(x.title || '') + ' ' + String(x.description || '') + ' ' + asTags(x.tags).join(' ')).toLowerCase().indexOf(search) < 0) return false;
        return true;
      }).sort(function(p, q) { return (q.priority || 0) - (p.priority || 0) || String(q.updatedAt || '').localeCompare(String(p.updatedAt || '')); });
    }

    var ACTION_STATUS_BADGES = { done: 'badge-green', active: 'badge-blue', blocked: 'badge-red', cancelled: 'badge-muted', pending: 'badge-yellow' };

    function actionRowHtml(x, ready) {
      var selected = state.actions.selectedId === x.id;
      var html = '<tr class="lesson-row' + (selected ? ' row-select' : '') + (isFresh(x.id) ? ' fresh' : '') + '" data-action="select-action" data-action-id="' + esc(x.id) + '" role="button" tabindex="0" aria-expanded="' + (selected ? 'true' : 'false') + '" style="cursor:pointer;">';
      html += '<td style="max-width:0;width:100%;"><div class="mem-head clamp-2">' + esc(x.title) + '</div>' + (x.description ? '<div class="mem-excerpt">' + esc(x.description) + '</div>' : '');

      html += '<td><span class="badge ' + (ACTION_STATUS_BADGES[x.status] || 'badge-muted') + '">' + esc(x.status) + '</span>' + (ready ? ' <span class="ready-badge" title="' + esc(GLOSSARY.frontierReady.text) + '">就绪</span>' : '') + '</td>';

      if (action === 'select-action') {

      if (action === 'action-set-status') { setActionStatus(target.getAttribute('data-action-id'), target.getAttribute('data-status')); return true; }

    function auditVerb(op) {

    function auditTargetSummary(ids) {
      var counts = {};
      (ids || []).forEach(function(id) {
        var k = ID_KIND_LABELS[idKind(id)] || '记录';
        counts[k] = (counts[k] || 0) + 1;
      });
      return Object.keys(counts).map(function(k) {
        var n = counts[k];
        var plural = k;
        return n + ' ' + (n === 1 ? k : plural);
      }).join(', ');
    }

    function auditDetailScalars(details) {
      var out = [];
      Object.keys(details || {}).forEach(function(k) {
        var v = details[k];
        if (v === null || v === undefined || v === '' || typeof v === 'object') return;
        out.push({ key: k, value: String(v) });
      });
      return out;
    }

      if (kind === 'memory' && (row = store.entities.memory[id])) return memoryHeadline(row).head;
      if (kind === 'lesson' && (row = store.entities.lesson[id])) return row.content || '';
      if (kind === 'action' && (row = store.entities.action[id])) return row.title || '';
      if (kind === 'crystal' && (row = store.entities.crystal[id])) return row.narrative || '';
      if (kind === 'session' && (row = store.entities.session[id])) return sessionDisplayName(row) + (row.firstPrompt ? ': ' + row.firstPrompt : '');

      else if (ids.length > 1) html += ': ' + esc(auditTargetSummary(ids));

    function auditFilterActive() {
      var a = state.audit;
      return !!(a.opFilter || a.from || a.to || String(a.q || '').trim());
    }

    function auditRange() {
      var a = state.audit;
      var from = a.from ? new Date(a.from + 'T00:00:00').getTime() : null;
      var to = a.to ? new Date(a.to + 'T23:59:59.999').getTime() : null;
      return { from: from !== null && isFinite(from) ? from : null, to: to !== null && isFinite(to) ? to : null };
    }

    function auditMatches(e) {
      var a = state.audit;
      if (!e) return false;
      if (a.opFilter && e.operation !== a.opFilter) return false;
      var r = auditRange();
      var t = new Date(e.timestamp).getTime();
      if (r.from !== null && !(t >= r.from)) return false;
      if (r.to !== null && !(t <= r.to)) return false;
      var q = String(a.q || '').trim().toLowerCase();
      if (q && ![e.functionId].concat(e.targetIds || []).some(function(v) { return String(v || '').toLowerCase().indexOf(q) >= 0; })) return false;
      return true;
    }

    function auditFilterKey() {
      var a = state.audit;
      return [a.opFilter, a.from, a.to, String(a.q || '').trim()].join('|');
    }

    function auditQueryPath(extra) {
      var a = state.audit;
      var r = auditRange();
      var p = 'audit?limit=' + AUDIT_PAGE;
      if (a.opFilter) p += '&operation=' + encodeURIComponent(a.opFilter);
      if (r.from !== null) p += '&dateFrom=' + encodeURIComponent(new Date(r.from).toISOString());
      if (r.to !== null) p += '&dateTo=' + encodeURIComponent(new Date(r.to).toISOString());
      if (String(a.q || '').trim()) p += '&q=' + encodeURIComponent(String(a.q).trim());
      return p + (extra || '');
    }

    function mergeAuditRows(rows) {
      var added = 0;
      (rows || []).forEach(function(r) {
        if (!r || !r.id) return;
        if (!store.entities.audit[r.id]) added++;
        store.entities.audit[r.id] = r;
      });
      return added;
    }

    function auditRows() {
      var rows = entityList('audit');
      if (auditFilterActive()) rows = rows.filter(auditMatches);
      return sortByTimeDesc(rows, ['timestamp']);
    }

    var auditQuerySeq = 0;
    async function applyAuditFilters() {
      var a = state.audit;
      var key = auditFilterKey();
      a.selectedIdx = null;
      if (!auditFilterActive()) { a.query = null; renderAudit(); return; }
      var seq = ++auditQuerySeq;
      a.query = { key: key, loading: true, failed: false };
      renderAudit();
      var res = await apiGet(auditQueryPath());
      if (seq !== auditQuerySeq) return;
      a.query.loading = false;
      if (!res) a.query.failed = true;
      else {
        mergeAuditRows(res.entries);
        if ((res.entries || []).length < AUDIT_PAGE) a.exhausted[key] = true;
      }
      renderAudit();
    }
    var applyAuditFiltersSoon = debounce(applyAuditFilters, 300);

    async function loadMoreAudit() {
      var a = state.audit;
      var key = auditFilterKey();
      var rows = auditRows();
      if (a.loadingMore || a.exhausted[key] || !rows.length) return;
      a.loadingMore = true;
      renderAudit();
      var oldest = rows[rows.length - 1].timestamp;
      var path = auditFilterActive() ? auditQueryPath() : 'audit?limit=' + AUDIT_PAGE;
      path = path.replace(/&dateTo=[^&]*/, '') + '&dateTo=' + encodeURIComponent(oldest);
      var res = await apiGet(path);
      a.loadingMore = false;
      if (res) {
        var added = mergeAuditRows(res.entries);
        if ((res.entries || []).length < AUDIT_PAGE || added === 0) a.exhausted[key] = true;
      }
      renderAudit();
    }

    function clearAuditFilters() {
      var a = state.audit;
      a.opFilter = '';
      a.from = '';
      a.to = '';
      a.q = '';
      a.query = null;
      auditQuerySeq++;
      renderAudit();
    }

      statusReportRequest = loadHealth().finally(function() {
        statusReportRequest = null;
        state.health.checking = false;
        markDirty(['health']);

      });
      return statusReportRequest;
    }

    function consolidationResultText(name, res) {
      if (!res) return '';
      if (res.error) return '失败：' + res.error;
      if (res.skipped) return '已跳过：' + (res.reason || '输入不足');
      if (name === 'semantic') return fmtNum(res.newFacts || 0) + ' 条新事实，来自 ' + fmtNum(res.totalSummaries || 0) + ' 条摘要';
      if (name === 'procedural') return fmtNum(res.newProcedures || 0) + ' 条新流程，来自 ' + fmtNum(res.patternsAnalyzed || 0) + ' 个模式';
      if (name === 'decay') return '已检查 ' + fmtNum(res.semantic || 0) + ' 条事实和 ' + fmtNum(res.procedural || 0) + ' 条流程';
      if (name === 'reflect') return res.success === false ? '无洞察' : fmtNum(res.newInsights || 0) + ' 条新洞察';
      if (name === 'obsidianExport') return res.success ? '已导出' : '导出失败';
      return '';
    }

    function consolidationWhyEmpty(cs, c) {

      if (!cs.enabled) return { text: 'CONSOLIDATION_ENABLED 被设为 false，因此即使存在 LLM 密钥，整合也处于关闭状态。请从 ~/.agentmemory/.env 中删除该行（或将其设为 true）并重启。用以下命令找到它：', cmd: 'grep -n CONSOLIDATION_ENABLED ~/.agentmemory/.env' };
      var t = cs.thresholds || {};
      if ((c.semantic || 0) === 0 && cs.summaries < (t.semanticMinSummaries || 5)) return { text: '已完成的会话还不够：语义事实需要 ' + (t.semanticMinSummaries || 5) + ' 条会话摘要，当前有 ' + cs.summaries + ' 条。请正常结束会话（Stop hook 会处理），以便每个会话都生成摘要。', cmd: curlPost('session/end', { sessionId: 'ses_...' }) };
      if ((c.procedural || 0) === 0 && cs.recurringPatterns < (t.proceduralMinPatterns || 2)) return { text: '流程需要 ' + (t.proceduralMinPatterns || 2) + ' 条模式记忆，且每条至少出现在 ' + (t.proceduralMinSessionsPerPattern || 2) + '+ 个会话中；当前有 ' + cs.recurringPatterns + ' 条。当同一工作流在多个会话中重复出现时，它们会逐渐积累。', cmd: '' };
      return null;
    }

    async function runConsolidation() {
      if (state.health.consolidating) return;
      state.health.consolidating = true;
      markDirty(['health']);
      renderTab('health');
      try {
        var res = await apiPost('consolidate-pipeline', { tier: 'all' });
        state.health.error = res && res.success === false && res.reason ? res.reason : null;
      } finally {
        state.health.consolidating = false;
        markDirty(['health']);
        if (state.activeTab === 'health') renderTab('health');
      }
    }
